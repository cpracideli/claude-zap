              'Fuso horário do usuário: ' + TZ + '. Data/hora atual: ' + nowStr + '.',
              'Idioma principal: ' + targetLang + '. Fale de forma natural, calorosa, direta e concisa, como em uma conversa telefônica real.',
              'Regras de estilo falado: evite listas longas, asteriscos, markdown, URLs completas ou códigos ditados; resuma informações técnicas em frases curtas e claras. Se o usuário interromper, pare imediatamente e responda ao que ele acabou de dizer.',
              'FERRAMENTA ask_agent: você tem acesso à ferramenta ask_agent, que aciona o agente completo da ponte com acesso real a WhatsApp, e-mail, memória, arquivos, código, Coolify, GitHub, agenda, controle do iPhone (IOS_Action) e outros bots especialistas.',
              'Use ask_agent SEMPRE que o usuário pedir uma ação real (enviar mensagem, consultar e-mail, checar servidor, editar arquivo, criar lembrete, consultar memória/agenda, pesquisar dados externos ou locais). Não invente dados nem diga que não tem acesso: chame ask_agent com uma instrução clara e autossuficiente e, quando voltar, explique o resultado de forma natural em voz alta.',
            ];
            const others = Object.values(bots).filter((x) => x.id !== b.id);
            if (others.length) {
              lines.push('Bots especialistas disponíveis para o parâmetro opcional "bot" de ask_agent: ' +
                others.map((x) => x.id + ' (' + x.name + (x.description ? ': ' + x.description.slice(0, 80) : '') + ')').join('; ') + '.');
            }
            if (b.instructions) {
              lines.push('Instruções específicas deste bot (adapte para fala natural):\n' + String(b.instructions).slice(0, 4000));
            }
            if (b.memory === 'own') {
              const mem = readBotMemory(b.id).trim();
              if (mem) lines.push('Memória própria deste bot:\n' + mem.slice(0, 2000));
            }
            if (chatId) {
              const rawList = isWeb(chatId)
                ? webHistory(chatId).map((m) => ({ role: m.role, bot: m.bot, text: m.text || m.transcript || '' }))
                : ((chats[chatId] && chats[chatId].recent) || []);
              const recent = rawList.filter((m) => String(m.text || '').trim()).slice(-12);
              if (recent.length) {
                lines.push('Contexto recente desta conversa (últimas ' + recent.length + ' mensagens):\n' +
                  recent.map((m) => {
                    const speaker = m.role === 'user' ? 'Usuário' : ((m.bot && bots[m.bot] ? bots[m.bot].name : b.name) || 'Assistente');
                    return speaker + ': ' + String(m.text || '').replace(/\s+/g, ' ').trim().slice(0, 500);
                  }).join('\n'));
              }
            }
            return lines.join('\n\n');
          }

          async function executeVoiceAskAgent(chatId, activeBot, request, targetBotArg) {
            const reqText = String(request || '').trim();
            if (!reqText) throw new Error('parâmetro "request" vazio');
            const resolvedBot = (targetBotArg && (bots[targetBotArg] || mentionBot(targetBotArg) || findBot(targetBotArg))) || activeBot || bots[DEFAULT_BOT];
            const ephemeral = !chatId;
            const execChatId = chatId || ('voice:' + crypto.randomBytes(4).toString('hex'));
            if (ephemeral) {
              const vc = chat(execChatId);
              if (resolvedBot && resolvedBot.id !== DEFAULT_BOT) vc.bot = resolvedBot.id;
            } else {
              chat(execChatId);
            }
            audit({ action: 'voice-live-tool', chatId: chatId || '', bot: resolvedBot ? resolvedBot.id : DEFAULT_BOT, preview: reqText.slice(0, 80) });
            const toolPrompt = '[Chamada de ferramenta durante ligação de voz em tempo real (ask_agent). Execute o pedido usando suas ferramentas se necessário e responda de forma objetiva, completa e direta — sua resposta será resumida em voz alta para o usuário.]\n\n' + reqText;
            let timer = null;
            let timedOut = false;
            try {
              const runPromise = new Promise((resolve, reject) => {
                enqueue(execChatId, async () => {
                  try {
                    const started = Date.now();
                    const r = await runTurn(execChatId, resolvedBot ? resolvedBot.id : null, toolPrompt, null, null, null, { noSteer: true, displayPrompt: reqText });
                    const ms = r.usage ? r.usage.ms : Date.now() - started;
                    recordRun(execChatId, { prompt: ('[voz] ' + reqText).slice(0, 80), ms, cost: r.usage ? r.usage.cost : 0, error: r.stopped ? 'interrompido' : r.error });
                    resolve(r);
                  } catch (e) {
                    reject(e);
                  }
                });
              });
              const timeoutPromise = new Promise((resolve) => {
                timer = setTimeout(() => {
                  timedOut = true;
                  const cur = running.get(execChatId);
                  if (cur && cur.child) { try { cur.child.kill('SIGTERM'); } catch {} }
                  resolve({ error: 'tempo limite excedido (' + Math.round(GEMINI_LIVE_TOOL_TIMEOUT_MS / 1000) + 's)' });
                }, GEMINI_LIVE_TOOL_TIMEOUT_MS);
              });
              const r = await Promise.race([runPromise, timeoutPromise]);
              if (timer) clearTimeout(timer);
              if (!r) return 'Sem resposta do agente.';
              if (timedOut || r.error) throw new Error(r.error || 'falha ao executar agente');
              if (r.stopped) throw new Error('execução interrompida');
              return String(r.text || 'Concluído sem texto de retorno.').trim().slice(0, 8000);
            } finally {
              if (timer) clearTimeout(timer);
              if (ephemeral) { delete chats[execChatId]; }
            }
          }

          async function decodeWsMessageText(data) {
            if (typeof data === 'string') return data;
            if (Buffer.isBuffer(data)) return data.toString('utf8');
            if (data instanceof ArrayBuffer) return Buffer.from(data).toString('utf8');
            if (ArrayBuffer.isView(data)) return Buffer.from(data.buffer, data.byteOffset, data.byteLength).toString('utf8');
            if (data && typeof data.text === 'function') return await data.text();
            return String(data || '');
          }

          function attachVoiceLiveWs(req, socket, head) {
            if (!adminAuthorized(req)) {
              socket.write('HTTP/1.1 401 Unauthorized\r\n\r\n');
              return socket.destroy();
            }
            const key = String(req.headers['sec-websocket-key'] || '');
            if (!key) {
              socket.write('HTTP/1.1 400 Bad Request\r\n\r\n');
              return socket.destroy();
            }
            const accept = wsAcceptKey(key);
            socket.write('HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Accept: ' + accept + '\r\n\r\n');

            const u = new URL(req.url || '/', 'http://local');
            const rawChatId = String(u.searchParams.get('chatId') || '').trim();
            let resolvedChatId = rawChatId;
            if (resolvedChatId && !chats[resolvedChatId] && !resolvedChatId.includes(':') && chats['web:' + resolvedChatId]) {
              resolvedChatId = 'web:' + resolvedChatId;
            }
            const botParam = String(u.searchParams.get('bot') || '').trim();
            const activeBot = (botParam && (bots[botParam] || mentionBot(botParam) || findBot(botParam)))
              || (resolvedChatId && chats[resolvedChatId] ? botOf(chats[resolvedChatId]) : bots[DEFAULT_BOT]);
            const lang = String(u.searchParams.get('lang') || 'pt-BR').trim() || 'pt-BR';
            const voice = String(u.searchParams.get('voice') || GEMINI_LIVE_DEFAULT_VOICE).trim() || GEMINI_LIVE_DEFAULT_VOICE;

            const apiKey = resolveGeminiApiKey();
            if (!apiKey) {
              wsSendText(socket, { type: 'error', message: 'Chave Gemini não configurada (configure gemini_api_key no Cofre, GEMINI_API_KEY ou ~/.config/gemini/api_key)', fatal: true });
              wsSendClose(socket, 1008, 'missing gemini api key');
              return;
            }

            let activeModel = GEMINI_LIVE_DEFAULT_MODEL;
            let triedFallback = false;
            let setupDone = false;
            let everSetupDone = false;
            let resumeHandle = '';
            let reconnectAttempts = 0;
            let closed = false;
            let upstreamWs = null;
            let reconnectTimer = null;
            let upstreamQueue = Promise.resolve();
            let pendingUserText = '';
            let pendingAssistantText = '';
            let turnCount = 0;
            const cancelledCalls = new Set();

            const pingTimer = setInterval(() => {
              if (!closed) wsSendPing(socket);
            }, GEMINI_LIVE_PING_MS);
            if (pingTimer.unref) pingTimer.unref();

            const persistVoiceMessage = (role, text) => {
              const clean = String(text || '').trim();
              if (!clean || !resolvedChatId) return;
              try {
                if (isWeb(resolvedChatId)) {
                  const c = chat(resolvedChatId);
                  if (role === 'user' && (!c.title || c.title === 'Nova conversa')) {
                    c.title = clean.replace(/\s+/g, ' ').slice(0, 60);
                    c.titleAuto = true;
                    save();
                  }
                  webAppend(resolvedChatId, {
                    role,
                    text: clean,
                    ...(role === 'assistant' ? { provider: 'gemini-live', bot: activeBot ? activeBot.id : DEFAULT_BOT, noPush: true } : {}),
                    meta: { voiceCall: true, ...(role === 'assistant' ? { model: activeModel, voice } : {}) },
                  });
                } else {
                  remember(resolvedChatId, role, clean, role === 'assistant' ? (activeBot ? activeBot.id : DEFAULT_BOT) : '');
                }
              } catch (e) {
                log('voice-live persist failed:', e.message);
              }
            };

            const flushUserTranscript = (emitToClient = true) => {
              const uText = pendingUserText.trim();
              if (!uText) return;
              pendingUserText = '';
              if (emitToClient && !closed) {
                wsSendText(socket, { type: 'transcript', role: 'user', text: uText, delta: false, final: true });
              }
              persistVoiceMessage('user', uText);
            };

            const flushAssistantTranscript = (emitToClient = true) => {
              const aText = pendingAssistantText.trim();
              if (!aText) return;
              pendingAssistantText = '';
              if (emitToClient && !closed) {
                wsSendText(socket, { type: 'transcript', role: 'assistant', text: aText, delta: false, final: true });
              }
              persistVoiceMessage('assistant', aText);
            };

            const flushTranscripts = (emitToClient = true) => {
              flushUserTranscript(emitToClient);
              flushAssistantTranscript(emitToClient);
            };

            const cleanup = (closeCode, closeReason) => {
              if (closed) return;
              closed = true;
              clearInterval(pingTimer);
              if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
              flushTranscripts(false);
              if (upstreamWs) {
                const wsRef = upstreamWs;
                upstreamWs = null;
                try { wsRef._bridgeIntentionalClose = true; wsRef.close(1000, 'client closed'); } catch {}
              }
              if (closeCode) wsSendClose(socket, closeCode, closeReason);
              else { try { socket.end(); } catch {} }
              audit({ action: 'voice-live-end', chatId: resolvedChatId || '', bot: activeBot ? activeBot.id : DEFAULT_BOT, turns: turnCount });
            };

            const sendUpstreamJson = (obj) => {
              if (!upstreamWs || upstreamWs.readyState !== 1) return false;
              try { upstreamWs.send(JSON.stringify(obj)); return true; } catch { return false; }
            };

            const handleToolCall = (fc) => {
              const callId = String((fc && fc.id) || crypto.randomBytes(4).toString('hex'));
              const fnName = String((fc && fc.name) || '');
              const args = (fc && fc.args && typeof fc.args === 'object') ? fc.args : {};
              if (fnName !== 'ask_agent') {
                sendUpstreamJson({
                  toolResponse: {
                    functionResponses: [{ id: callId, name: fnName, response: { result: 'Ferramenta desconhecida: ' + fnName } }],
                  },
                });
                return;
              }
              const request = String(args.request || '').trim();
              const targetBotArg = String(args.bot || '').trim();
              flushUserTranscript(true);
              wsSendText(socket, { type: 'tool', name: 'ask_agent', status: 'running', detail: request });
              executeVoiceAskAgent(resolvedChatId, activeBot, request, targetBotArg).then((result) => {
                if (closed || cancelledCalls.has(callId)) return;
                sendUpstreamJson({
                  toolResponse: {
                    functionResponses: [{ id: callId, name: 'ask_agent', response: { result } }],
                  },
                });
                wsSendText(socket, { type: 'tool', name: 'ask_agent', status: 'done', detail: request, summary: result.slice(0, 300) });
              }).catch((err) => {
                if (closed || cancelledCalls.has(callId)) return;
                const errMsg = String((err && err.message) || err || 'erro desconhecido');
                sendUpstreamJson({
                  toolResponse: {
                    functionResponses: [{ id: callId, name: 'ask_agent', response: { result: 'Erro ao executar ask_agent: ' + errMsg } }],
                  },
                });
                wsSendText(socket, { type: 'tool', name: 'ask_agent', status: 'error', detail: request, summary: errMsg.slice(0, 300) });
              });
            };

            const handleUpstreamMessage = (msg, isResumed) => {
              if (closed || !msg || typeof msg !== 'object') return;
              if (msg.setupComplete !== undefined) {
                setupDone = true;
                everSetupDone = true;
                reconnectAttempts = 0;
                wsSendText(socket, {
                  type: 'ready',
                  model: activeModel,
                  voice,
                  sampleRateIn: 16000,
                  sampleRateOut: 24000,
                  ...(isResumed ? { resumed: true } : {}),
                });
              }
              if (msg.sessionResumptionUpdate && msg.sessionResumptionUpdate.newHandle && msg.sessionResumptionUpdate.resumable !== false) {
                resumeHandle = String(msg.sessionResumptionUpdate.newHandle);
              }
              if (msg.goAway) {
                if (!closed && resumeHandle && reconnectAttempts < GEMINI_LIVE_MAX_RECONNECTS) {
                  reconnectAttempts += 1;
                  wsSendText(socket, { type: 'reconnecting', reason: 'goAway' });
                  if (upstreamWs) {
                    const oldWs = upstreamWs;
                    upstreamWs = null;
                    try { oldWs._bridgeIntentionalClose = true; oldWs.close(1000, 'reconnecting'); } catch {}
                  }
                  setupDone = false;
                  const delay = GEMINI_LIVE_RECONNECT_BASE_MS * Math.pow(2, reconnectAttempts - 1);
                  reconnectTimer = setTimeout(() => { reconnectTimer = null; if (!closed) connectUpstream(true); }, delay);
                  return;
                }
              }
              if (msg.toolCallCancellation && Array.isArray(msg.toolCallCancellation.ids)) {
                for (const id of msg.toolCallCancellation.ids) cancelledCalls.add(String(id));
              }
              if (msg.toolCall && Array.isArray(msg.toolCall.functionCalls)) {
                for (const fc of msg.toolCall.functionCalls) handleToolCall(fc);
              }
              const sc = msg.serverContent;
              if (sc && typeof sc === 'object') {
                if (sc.inputTranscription && typeof sc.inputTranscription.text === 'string' && sc.inputTranscription.text) {
                  const chunk = sc.inputTranscription.text;
                  pendingUserText += chunk;
                  wsSendText(socket, { type: 'transcript', role: 'user', text: chunk, delta: true, final: false });
                }
                if (sc.modelTurn && Array.isArray(sc.modelTurn.parts)) {
                  for (const part of sc.modelTurn.parts) {
                    if (part && part.inlineData && part.inlineData.data) {
                      const mime = String(part.inlineData.mimeType || '').toLowerCase();
                      if (mime.startsWith('audio/pcm')) {
                        flushUserTranscript(true);
                        const pcm = Buffer.from(part.inlineData.data, 'base64');
                        if (pcm.length) wsSendBinary(socket, pcm);
                      }
                    }
                  }
                }
                if (sc.outputTranscription && typeof sc.outputTranscription.text === 'string' && sc.outputTranscription.text) {
                  flushUserTranscript(true);
                  const chunk = sc.outputTranscription.text;
                  pendingAssistantText += chunk;
                  wsSendText(socket, { type: 'transcript', role: 'assistant', text: chunk, delta: true, final: false });
                }
                if (sc.interrupted) {
                  flushTranscripts(true);
                  wsSendText(socket, { type: 'interrupted' });
                }
                if (sc.turnComplete) {
                  turnCount += 1;
                  flushTranscripts(true);
                  wsSendText(socket, { type: 'turn_complete' });
                }
              }
            };

            const connectUpstream = (isResumed = false) => {
              if (closed) return;
              setupDone = false;
              const url = GEMINI_LIVE_WS_URL + (GEMINI_LIVE_WS_URL.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(apiKey);
              let ws;
              try {
                ws = new WebSocket(url);
              } catch (e) {
                wsSendText(socket, { type: 'error', message: 'Erro ao conectar ao Gemini Live: ' + e.message, fatal: true });
                return cleanup(1011, 'upstream connect error');
              }
              upstreamWs = ws;
              let lastError = '';

              ws.addEventListener('open', () => {
                if (closed || upstreamWs !== ws) { try { ws._bridgeIntentionalClose = true; ws.close(); } catch {} return; }
                const sysText = buildVoiceLiveSystemPrompt(resolvedChatId, activeBot, lang);
                const setupPayload = {
                  setup: {
                    model: activeModel,
                    generationConfig: {
                      responseModalities: ['AUDIO'],
                      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } },
                    },
                    systemInstruction: { parts: [{ text: sysText }] },
                    inputAudioTranscription: {},
                    outputAudioTranscription: {},
                    sessionResumption: resumeHandle ? { handle: resumeHandle } : {},
                    contextWindowCompression: { slidingWindow: {} },
                    tools: [{
                      functionDeclarations: [{
                        name: 'ask_agent',
                        description: 'Aciona o agente completo da ponte com acesso a todas as ferramentas (WhatsApp, e-mail, memória, arquivos, código, Coolify, GitHub, agenda, iPhone IOS_Action, outros bots). Use sempre que precisar executar uma ação real ou consultar dados externos/locais.',
                        parameters: {
                          type: 'OBJECT',
                          properties: {
                            request: { type: 'STRING', description: 'Instrução clara e autossuficiente do que executar ou consultar' },
                            bot: { type: 'STRING', description: 'ID opcional de um bot especialista (ex: infra, email, familia, trabalho, viagens, radar, arquivista). Omita para usar o bot atual do chat.' },
                          },
                          required: ['request'],
                        },
                      }],
                    }],
                  },
                };
                try { ws.send(JSON.stringify(setupPayload)); }
                catch (e) { lastError = e.message; }
              });

              ws.addEventListener('message', (ev) => {
                if (closed || upstreamWs !== ws) return;
                upstreamQueue = upstreamQueue.then(async () => {
                  if (closed || upstreamWs !== ws) return;
                  const txt = await decodeWsMessageText(ev.data);
                  let parsed;
                  try { parsed = JSON.parse(txt); } catch { return; }
                  handleUpstreamMessage(parsed, isResumed);
                }).catch((e) => { log('voice-live upstream msg err:', e.message); });
              });

              ws.addEventListener('error', (ev) => {
                lastError = (ev && ev.message) || 'erro na conexão WebSocket com Gemini Live';
              });

              ws.addEventListener('close', (ev) => {
                if (closed || ws._bridgeIntentionalClose || upstreamWs !== ws) return;
                upstreamWs = null;
                const code = Number((ev && ev.code) || 1006);
                const reason = String((ev && ev.reason) || lastError || ('código ' + code));
                // Fallback model if initial setup failed on primary model
                if (!everSetupDone && !triedFallback && GEMINI_LIVE_FALLBACK_MODEL && activeModel !== GEMINI_LIVE_FALLBACK_MODEL) {
                  log('voice-live setup failed on', activeModel, '(' + reason + '), falling back to', GEMINI_LIVE_FALLBACK_MODEL);
                  triedFallback = true;
                  activeModel = GEMINI_LIVE_FALLBACK_MODEL;
                  resumeHandle = '';
                  connectUpstream(false);
                  return;
                }
                // Recoverable drop after setup with session resumption handle
                const unrecoverable = code === 4001 || code === 4003 || code === 1008;
                if (everSetupDone && !unrecoverable && resumeHandle && reconnectAttempts < GEMINI_LIVE_MAX_RECONNECTS) {
                  reconnectAttempts += 1;
                  setupDone = false;
                  wsSendText(socket, { type: 'reconnecting', reason });
                  const delay = GEMINI_LIVE_RECONNECT_BASE_MS * Math.pow(2, reconnectAttempts - 1);
                  reconnectTimer = setTimeout(() => { reconnectTimer = null; if (!closed) connectUpstream(true); }, delay);
                  return;
                }
                wsSendText(socket, { type: 'error', message: 'Conexão Gemini Live encerrada: ' + reason, fatal: true });
                cleanup(1011, 'upstream closed');
              });
            };

            createWsFrameParser(socket, {
              onBinary(buf) {
                if (closed || !setupDone || !buf || !buf.length) return;
                sendUpstreamJson({
                  realtimeInput: {
                    audio: { mimeType: 'audio/pcm;rate=16000', data: buf.toString('base64') },
                  },
                });
              },
              onText(str) {
                if (closed) return;
                let msg;
                try { msg = JSON.parse(str); } catch { return; }
                if (!msg || typeof msg !== 'object') return;
                if (msg.type === 'ping') {
                  wsSendText(socket, { type: 'pong', ts: Date.now() });
                  return;
                }
                if (msg.type === 'audio_end') {
                  if (setupDone) sendUpstreamJson({ realtimeInput: { audioStreamEnd: true } });
                  return;
                }
                if (msg.type === 'text') {
                  const txt = String(msg.text || '').trim();
                  if (!txt || !setupDone) return;
                  pendingUserText = pendingUserText ? (pendingUserText + ' ' + txt) : txt;
                  sendUpstreamJson({
                    clientContent: {
                      turns: [{ role: 'user', parts: [{ text: txt }] }],
                      turnComplete: true,
                    },
                  });
                }
              },
              onClose() { cleanup(); },
            }, head);

            socket.on('close', () => cleanup());
            socket.on('error', () => cleanup());

            audit({ action: 'voice-live-start', chatId: resolvedChatId || '', bot: activeBot ? activeBot.id : DEFAULT_BOT, model: activeModel, voice });
            connectUpstream(false);
          }

          // ---------- periodic maintenance (trash pruning + durable job recovery) ----------
          function runMaintenanceJob() {
            checkpointWal();
            try {
              const trash = path.join(DATA_DIR, 'memory-trash');
              const cutoff = Date.now() - 30 * 86400000;
              for (const f of fs.readdirSync(trash)) {
                const full = path.join(trash, f);
                try { if (fs.statSync(full).mtimeMs < cutoff) fs.unlinkSync(full); } catch {}
              }
            } catch {}
          }
          function recoverPendingJobs() {
            const jobs = listPendingJobs();
            for (const j of jobs) {
              finishPendingJob(j.id);
              if (j.kind === 'task' && j.payload && j.payload.id) {
                const cur = taskSessions.find((x) => x.id === j.payload.id);
                if (cur && cur.status === 'running') {
                  cur.status = 'error';
                  cur.error = 'interrompida por reinício/redeploy do servidor';
                  cur.doneAt = new Date().toISOString();
                  saveTasks();
                }
              }
            }
            // Detect tickets left in_progress across a bridge restart/crash
            const recoveredTickets = [];
            for (const tk of tickets) {
              if (tk.status !== 'in_progress') continue;
              if (tk.goal && tk.nextCheckAt) continue; // sleeping goal waiting for nextCheckAt is normal
              const active = Boolean((tk.runChatId && running.has(tk.runChatId)) || (tk.chatId && running.has(tk.chatId)));
              if (active || tk.interrupted) continue;
              tk.interrupted = true;
              const cm = {
                id: crypto.randomBytes(3).toString('hex'),
                author: 'Sistema',
                text: '⚠️ Execução interrompida por reinício ou queda da ponte. Use "Retomar" para continuar de onde parou.',
                at: new Date().toISOString(),
                via: 'system',
              };
              tk.comments = [...(tk.comments || []), cm].slice(-100);
              tk.updated = cm.at;
              recoveredTickets.push(tk);
              audit({ action: 'ticket-interrupted', id: tk.id });
            }
            if (recoveredTickets.length > 0) {
              saveTickets();
              notifyRecoveredTicketsWhatsApp(recoveredTickets).catch(() => {});
            }
          }

          setInterval(() => {
            if (computer.status === 'running' && computer.control !== 'human' && !computer.needsHuman.active && Date.now() - computer.lastActivity > COMPUTER_IDLE_MS) {
              log('computer: idle timeout, stopping');
              stopComputer();
            }
          }, 60000).unref();

          // ---------- Guest / Family restricted WhatsApp access per bot ----------
          function findGuestAccess(number) {
            const clean = String(number || '').replace(/\D/g, '');
            if (!clean) return null;
            const list = Array.isArray(settings.guestAccess) ? settings.guestAccess : [];
            return list.find((g) => g && g.enabled && String(g.number || '').replace(/\D/g, '') === clean) || null;
          }

          // ---------- Assisted Drafts Queue (WhatsApp & Email, editable + schedule + send) ----------
          const DRAFTS_FILE = path.join(DATA_DIR, 'drafts.json');
          let drafts = loadState('drafts', DRAFTS_FILE, []);
          const saveDrafts = () => saveState('drafts', DRAFTS_FILE, drafts);
          const draftSending = new Set();
          function formatDecisionDate(iso) {
            try {
              const dt = new Date(iso);
              if (isNaN(dt)) return String(iso || '');
              return dt.toLocaleString('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch {
              return String(iso || '');
            }
          }
          function createDraft(b, via = 'agent') {
            const channel = ['whatsapp', 'email'].includes(String(b.channel || '').toLowerCase()) ? String(b.channel).toLowerCase() : 'whatsapp';
            const to = String(b.to || '').trim().slice(0, 200);
            const body = String(b.body || b.text || '').trim().slice(0, 20000);
            if (!to) throw new Error('destinatário (to) obrigatório');
            if (!body) throw new Error('conteúdo (body) obrigatório');
            if (channel === 'whatsapp' && !allowThirdPartySend()) {
              if (to.endsWith('@g.us') || to.endsWith('@newsletter') || to === 'status@broadcast') throw new Error(THIRD_PARTY_BLOCKED_MSG);
              if (to.endsWith('@lid')) {
                const resolved = lidCache.get(to) || '';
                if (!isAllowedPhone(resolved)) throw new Error(THIRD_PARTY_BLOCKED_MSG);
              } else {
                const phone = to.includes('@') ? to.split('@')[0].split(':')[0] : to;
                if (!isAllowedPhone(phone)) throw new Error(THIRD_PARTY_BLOCKED_MSG);
              }
            }
            let scheduledAt = '';
            if (b.scheduledAt) {
              const dt = new Date(b.scheduledAt);
              if (isNaN(dt)) throw new Error('scheduledAt inválido');
              scheduledAt = dt.toISOString();
            }
            const now = new Date().toISOString();
            const d = {
              id: crypto.randomBytes(4).toString('hex'),
              channel,
              to,
              subject: channel === 'email' ? String(b.subject || '(sem assunto)').trim().slice(0, 200) : '',
              from: channel === 'email' ? (String(b.from || 'agentmail').toLowerCase() === 'gmail' ? 'gmail' : 'agentmail') : '',
              body,
              bot: b.bot && bots[b.bot] ? b.bot : DEFAULT_BOT,
              chatId: String(b.chatId || ''),
              note: String(b.note || '').trim().slice(0, 300),
              status: scheduledAt ? 'scheduled' : 'draft',
              scheduledAt,
              created: now,
              updated: now,
            };
            drafts.push(d);
            drafts = drafts.slice(-200);
            saveDrafts();
            audit({ action: 'draft-create', id: d.id, channel, to, status: d.status, via });
            notifyPush({ title: 'Novo rascunho (' + channel + ')', body: 'Para ' + to + ': ' + body.slice(0, 120), tag: 'draft-' + d.id, url: '/#/inbox' });
            webGlobalEmit({ type: 'draft', id: d.id, channel, to, body: cleanPushPreview(body, 160), tag: 'draft-' + d.id, url: '/#/inbox' });
            const chLabel = channel === 'email' ? 'E-mail' : 'WhatsApp';
            const draftLines = [
              '📝 *Rascunho aguardando decisão*',
              '• *Canal:* ' + chLabel,
              '• *Para:* ' + d.to,
            ];
            if (d.channel === 'email' && d.subject) draftLines.push('• *Assunto:* ' + d.subject);
            if (d.status === 'scheduled' && d.scheduledAt) draftLines.push('• *Agendado para:* ' + formatDecisionDate(d.scheduledAt));
            draftLines.push('• *Prévia:* ' + cleanPushPreview(d.body, 220));
            notifyDecisionWhatsApp(draftLines.join('\n'), { panelPath: '/#/inbox' }).catch(() => {});
            return d;
          }
          function patchDraft(id, b, via = 'panel') {
            const d = drafts.find((x) => x.id === id);
            if (!d) throw new Error('rascunho não encontrado');
            if (d.status === 'sent') throw new Error('rascunho já foi enviado');
            if ('to' in b && String(b.to || '').trim()) d.to = String(b.to).trim().slice(0, 200);
            if ('subject' in b) d.subject = String(b.subject || '').trim().slice(0, 200);
            if ('body' in b && String(b.body || '').trim()) d.body = String(b.body).trim().slice(0, 20000);
            if ('note' in b) d.note = String(b.note || '').trim().slice(0, 300);
            if ('scheduledAt' in b) {
              if (!b.scheduledAt) { d.scheduledAt = ''; if (d.status === 'scheduled') d.status = 'draft'; }
              else {
                const dt = new Date(b.scheduledAt);
                if (isNaN(dt)) throw new Error('scheduledAt inválido');
                d.scheduledAt = dt.toISOString();
                d.status = 'scheduled';
              }
            }
            d.updated = new Date().toISOString();
            saveDrafts();
            audit({ action: 'draft-update', id: d.id, status: d.status, via });
            return d;
          }
          function deleteDraft(id, via = 'panel') {
            const n = drafts.length;
            drafts = drafts.filter((x) => x.id !== id);
            if (n === drafts.length) throw new Error('rascunho não encontrado');
            saveDrafts();
            audit({ action: 'draft-delete', id, via });
            return { deleted: id };
          }
          async function sendDraft(id, via = 'panel') {
            const d = drafts.find((x) => x.id === id);
            if (!d) throw new Error('rascunho não encontrado');
            if (d.status === 'sent') return d;
            if (draftSending.has(d.id)) throw new Error('envio já em andamento');
            draftSending.add(d.id);
            try {
              if (d.channel === 'whatsapp') {
                await sendMessage({ to: d.to, text: d.body });
              } else {
                const bin = d.from === 'gmail' ? path.join(env.HOME || '/tmp', 'bin', 'gmail.py') : path.join(env.HOME || '/tmp', 'bin', 'agentmail');
                if (fs.existsSync(bin)) {
                  const args = d.from === 'gmail'
                    ? ['send', '--to', d.to, '--subject', d.subject || '(sem assunto)', '--body', d.body]
                    : ['send', '--to', d.to, '--subject', d.subject || '(sem assunto)', '--text', d.body];
                  const r = await execCmd(bin, args, 30000);
                  if (r.code !== 0) throw new Error((r.err || r.out || 'falha ao enviar e-mail').slice(0, 300));
                } else {
                  const amKey = env.AGENTMAIL_API_KEY || (secrets.agentmail_api_key && secrets.agentmail_api_key.value) || '';
                  const amInbox = env.AGENTMAIL_INBOX || (secrets.agentmail_inbox && secrets.agentmail_inbox.value) || '';
                  if (d.from !== 'gmail' && amKey && amInbox) {
                    const r = await fetch('https://api.agentmail.to/v0/inboxes/' + encodeURIComponent(amInbox) + '/messages/send', {
                      method: 'POST',
