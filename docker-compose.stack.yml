              const runAgyStep = (args) => execCmd(bin, args, 150000);
              const baseArgs = ['-p', prompt, '--output-format', 'json'];
              if (PERMISSION_MODE === 'bypassPermissions') baseArgs.push('--dangerously-skip-permissions');
              const r1 = await runAgyStep(baseArgs);
              let convId = '';
              let respText = r1.out || '';
              try {
                const j = JSON.parse(r1.out || '{}');
                convId = j.conversation_id || '';
                respText = j.response || r1.out || '';
                if (j.status && j.status !== 'SUCCESS' && !respText) throw new Error('Antigravity: ' + j.status);
              } catch (e) {
                if (r1.code !== 0 && !respText) throw new Error('agy falhou: ' + (r1.err || r1.out || e.message).slice(-300));
              }
              let imgPath = findGeneratedAvatarFile(respText, convId, sinceMs);
              // The image-generator subagent runs asynchronously; follow up in the same conversation if needed.
              for (let step = 0; !imgPath && step < 3; step++) {
                await new Promise((res) => setTimeout(res, 2500));
                imgPath = findGeneratedAvatarFile('', convId, sinceMs);
                if (imgPath) break;
                if (!convId) break;
                const followArgs = ['--conversation', convId, '-p', 'Aguarde o subagente image-generator terminar e responda apenas com o caminho absoluto do arquivo de imagem gerado.', '--output-format', 'json'];
                if (PERMISSION_MODE === 'bypassPermissions') followArgs.push('--dangerously-skip-permissions');
                const rNext = await runAgyStep(followArgs);
                let nextText = rNext.out || '';
                try { nextText = JSON.parse(rNext.out || '{}').response || nextText; } catch {}
                imgPath = findGeneratedAvatarFile(nextText, convId, sinceMs);
              }
              if (!imgPath) throw new Error('Não foi possível localizar a imagem gerada pelo Antigravity (timeout ou falha no image-generator)');
              return convertAvatarToDataUri(imgPath);
            });
            avatarGenQueue = job.catch(() => {});
            return job;
          }

          // ---------- admin API for the Agent Control panel ----------
          // Reached over the private coolify network at http://claude-bridge-claude-zap:3000/admin/...
          // Every call needs "Authorization: Bearer <BRIDGE_ADMIN_TOKEN>". Without that variable the API is off.
          const ADMIN_TOKEN = env.BRIDGE_ADMIN_TOKEN || '';
          const CLAUDE_MODELS = [{ id: 'opus', label: 'Opus' }, { id: 'sonnet', label: 'Sonnet' }, { id: 'haiku', label: 'Haiku' }, { id: 'fable', label: 'Fable' }];

          function adminTokenMatches(tok) {
            if (!ADMIN_TOKEN) return false;
            const got = Buffer.from(String(tok || ''));
            const want = Buffer.from(ADMIN_TOKEN);
            return got.length === want.length && crypto.timingSafeEqual(got, want);
          }

          function adminAuthorized(req) {
            return adminTokenMatches(String(req.headers.authorization || '').replace(/^Bearer\s+/i, ''));
          }

          function adminAuthorizedWithQuery(req, u) {
            if (adminAuthorized(req)) return true;
            const qtok = u && u.searchParams ? u.searchParams.get('token') : '';
            return Boolean(qtok) && adminTokenMatches(qtok);
          }

          // ---------- WaCalls (WhatsApp VoIP calls via pure-Go sidecar) ----------
          const WACALLS_BIN = env.WACALLS_BIN || path.join(env.HOME || '/tmp', '.local', 'bin', 'wacalls');
          const WACALLS_PORT = Number(env.WACALLS_PORT || 8088);
          const WACALLS_ENABLED = env.WACALLS_ENABLED !== '0';
          const WACALLS_URL = 'http://127.0.0.1:' + WACALLS_PORT;
          const WACALLS_DIR = path.join(DATA_DIR, 'wacalls');
          const WACALLS_DB = path.join(WACALLS_DIR, 'wacalls.db');
          const WACALLS_LOG = path.join(WACALLS_DIR, 'wacalls.log');
          const wacalls = {
            child: null,
            running: false,
            stoppedManually: false,
            restarts: 0,
            backoff: 2000,
            timer: null,
            error: null,
            sseReq: null,
            sseTimer: null,
            sseBackoff: 2000,
            pushedCalls: new Map(),
          };

          function wacallsAvailable() {
            return Boolean(WACALLS_ENABLED && fs.existsSync(WACALLS_BIN));
          }

          async function wacallsFetchSessions() {
            try {
              const r = await fetch(WACALLS_URL + '/api/sessions', { signal: AbortSignal.timeout(2500) });
              if (!r.ok) return { ok: false, sessions: [] };
              const j = await r.json().catch(() => ({}));
              return { ok: true, sessions: Array.isArray(j.sessions) ? j.sessions : [] };
            } catch {
              return { ok: false, sessions: [] };
            }
          }

          function formatWaCallPeer(peer) {
            const s = String(peer || '').trim();
            if (!s) return 'desconhecido';
            const user = s.split('@')[0].split(':')[0];
            if (/^\d{8,16}(?![\s\S])/.test(user)) return '+' + user;
            return user || s;
          }

          function stopWaCallsSse() {
            if (wacalls.sseTimer) {
              clearTimeout(wacalls.sseTimer);
              wacalls.sseTimer = null;
            }
            if (wacalls.sseReq) {
              try { wacalls.sseReq.destroy(); } catch {}
              wacalls.sseReq = null;
            }
          }

          function scheduleWaCallsSseReconnect() {
            if (wacalls.sseTimer || wacalls.stoppedManually || !WACALLS_ENABLED) return;
            if (!wacalls.child && !wacalls.running && !wacallsAvailable()) return;
            const delay = wacalls.sseBackoff;
            wacalls.sseBackoff = Math.min(wacalls.sseBackoff * 2, 15000);
            wacalls.sseTimer = setTimeout(() => {
              wacalls.sseTimer = null;
              startWaCallsSse();
            }, delay);
            if (wacalls.sseTimer.unref) wacalls.sseTimer.unref();
          }

          function handleWaCallsSseEvent(ev) {
            if (!ev || ev.type !== 'incoming') return;
            const callId = String(ev.id || '').trim();
            const now = Date.now();
            for (const [k, ts] of wacalls.pushedCalls.entries()) {
              if (now - ts > 120000) wacalls.pushedCalls.delete(k);
            }
            if (callId && wacalls.pushedCalls.has(callId)) return;
            if (callId) wacalls.pushedCalls.set(callId, now);
            const peerLabel = formatWaCallPeer(ev.peer);
            notifyPush({
              title: '📞 Ligação WhatsApp',
              body: 'Chamada recebida de ' + peerLabel,
              tag: 'wacall-' + (callId || now),
              url: '/#/calls',
              data: { callId, sessionId: String(ev.sessionId || ''), peer: String(ev.peer || '') },
            });
          }

          function startWaCallsSse() {
            if (wacalls.sseReq || wacalls.stoppedManually || !WACALLS_ENABLED) return;
            const req = http.request({
              host: '127.0.0.1',
              port: WACALLS_PORT,
              path: '/api/events?clientId=bridge-push',
              method: 'GET',
              headers: { Accept: 'text/event-stream' },
            }, (res) => {
              if (res.statusCode !== 200) {
                res.resume();
                wacalls.sseReq = null;
                scheduleWaCallsSseReconnect();
                return;
              }
              wacalls.sseBackoff = 2000;
              let buf = '';
              res.setEncoding('utf8');
              res.on('data', (chunk) => {
                buf += chunk;
                buf = buf.replace(/\r\n/g, '\n');
                let sep;
                while ((sep = buf.indexOf('\n\n')) !== -1) {
                  const block = buf.slice(0, sep);
                  buf = buf.slice(sep + 2);
                  const dataLines = [];
                  for (const line of block.split('\n')) {
                    if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
                  }
                  if (!dataLines.length) continue;
                  try {
                    handleWaCallsSseEvent(JSON.parse(dataLines.join('\n')));
                  } catch {}
                }
              });
              const onDone = () => {
                if (wacalls.sseReq === req) wacalls.sseReq = null;
                scheduleWaCallsSseReconnect();
              };
              res.on('end', onDone);
              res.on('close', onDone);
              res.on('error', onDone);
            });
            req.on('error', () => {
              if (wacalls.sseReq === req) wacalls.sseReq = null;
              scheduleWaCallsSseReconnect();
            });
            req.end();
            wacalls.sseReq = req;
          }

          async function ensureWaCalls(opts) {
            const manual = Boolean(opts && opts.manual);
            if (!WACALLS_ENABLED) {
              wacalls.running = false;
              wacalls.error = 'desativado (WACALLS_ENABLED=0)';
              return false;
            }
            if (manual) wacalls.stoppedManually = false;
            if (wacalls.stoppedManually) return false;
            if (wacalls.child) {
              const h = await wacallsFetchSessions();
              wacalls.running = h.ok;
              if (h.ok) {
                wacalls.error = null;
                startWaCallsSse();
              }
              return h.ok;
            }
            const existing = await wacallsFetchSessions();
            if (existing.ok) {
              wacalls.running = true;
              wacalls.error = null;
              wacalls.backoff = 2000;
              startWaCallsSse();
              return true;
            }
            if (!fs.existsSync(WACALLS_BIN)) {
              wacalls.running = false;
              wacalls.error = null;
              return false;
            }
            if (wacalls.timer) {
              if (!manual) return false;
              clearTimeout(wacalls.timer);
              wacalls.timer = null;
            }
            fs.mkdirSync(WACALLS_DIR, { recursive: true });
            let outFd;
            try { outFd = fs.openSync(WACALLS_LOG, 'a'); }
            catch (e) { wacalls.error = e.message; return false; }
            log('wacalls: starting', WACALLS_BIN, 'on 127.0.0.1:' + WACALLS_PORT);
            const child = spawn(WACALLS_BIN, ['-addr', '127.0.0.1:' + WACALLS_PORT, '-db', WACALLS_DB], {
              cwd: WACALLS_DIR,
              env,
              stdio: ['ignore', outFd, outFd],
            });
            fs.closeSync(outFd);
            wacalls.child = child;
            wacalls.error = null;
            const startedAt = Date.now();
            child.on('error', (e) => {
              wacalls.error = e.message;
              log('wacalls: failed to start:', e.message);
            });
            child.on('close', (code, signal) => {
              if (wacalls.child === child) wacalls.child = null;
              wacalls.running = false;
              stopWaCallsSse();
              if (wacalls.stoppedManually) return;
              wacalls.error = 'encerrado (' + (signal || code) + ')';
              if (Date.now() - startedAt > 60000) wacalls.backoff = 2000;
              wacalls.restarts += 1;
              const delay = wacalls.backoff;
              wacalls.backoff = Math.min(wacalls.backoff * 2, 120000);
              log('wacalls: exited with', signal || code, '| restarting in', Math.round(delay / 1000), 's | see', WACALLS_LOG);
              wacalls.timer = setTimeout(() => {
                wacalls.timer = null;
                ensureWaCalls().catch(() => {});
              }, delay);
              if (wacalls.timer.unref) wacalls.timer.unref();
            });
            for (let i = 0; i < 15; i++) {
              if (wacalls.child !== child) break;
              await new Promise((r) => setTimeout(r, 200));
              const h = await wacallsFetchSessions();
              if (h.ok) {
                wacalls.running = true;
                wacalls.error = null;
                log('wacalls: healthy at', WACALLS_URL);
                startWaCallsSse();
                return true;
              }
            }
            return wacalls.running;
          }

          async function wacallsStatus() {
            const available = wacallsAvailable();
            const h = await wacallsFetchSessions();
            if (h.ok) {
              wacalls.running = true;
              wacalls.error = null;
              if (!wacalls.stoppedManually) startWaCallsSse();
            } else if (!wacalls.child) {
              wacalls.running = false;
            }
            return {
              available,
              running: h.ok,
              port: WACALLS_PORT,
              sessions: h.ok ? h.sessions : [],
              error: h.ok ? null : (wacalls.error || null),
            };
          }

          async function startWaCalls() {
            wacalls.stoppedManually = false;
            await ensureWaCalls({ manual: true });
            return await wacallsStatus();
          }

          async function stopWaCalls() {
            wacalls.stoppedManually = true;
            if (wacalls.timer) {
              clearTimeout(wacalls.timer);
              wacalls.timer = null;
            }
            stopWaCallsSse();
            const child = wacalls.child;
            if (child) {
              await new Promise((resolve) => {
                let done = false;
                const finish = () => { if (!done) { done = true; resolve(); } };
                child.once('close', finish);
                try { child.kill('SIGTERM'); } catch { finish(); }
                setTimeout(() => {
                  if (!done) {
                    try { child.kill('SIGKILL'); } catch {}
                    finish();
                  }
                }, 2500).unref();
              });
            }
            wacalls.child = null;
            wacalls.running = false;
            wacalls.error = null;
            return await wacallsStatus();
          }

          function proxyWaCallsHttp(req, res, u, raw) {
            const upstreamPath = u.pathname.replace(/^\/admin\/wacalls/, '') + (u.search || '');
            const fwdHeaders = {};
            for (const h of ['x-client-id', 'content-type', 'accept', 'last-event-id']) {
              if (req.headers[h] !== undefined) fwdHeaders[h] = req.headers[h];
            }
            if (raw && raw.length) fwdHeaders['content-length'] = String(raw.length);
            const upReq = http.request({
              host: '127.0.0.1',
              port: WACALLS_PORT,
              path: upstreamPath,
              method: req.method,
              headers: fwdHeaders,
            }, (upRes) => {
              const ct = String(upRes.headers['content-type'] || '');
              const isSse = ct.includes('text/event-stream') || u.pathname === '/admin/wacalls/api/events';
              const outHeaders = {};
              if (isSse) {
                outHeaders['Content-Type'] = ct || 'text/event-stream';
                outHeaders['Cache-Control'] = 'no-cache';
                outHeaders['Connection'] = 'keep-alive';
                outHeaders['X-Accel-Buffering'] = 'no';
              } else {
                if (ct) outHeaders['Content-Type'] = ct;
                if (upRes.headers['cache-control']) outHeaders['Cache-Control'] = upRes.headers['cache-control'];
                if (upRes.headers['content-length']) outHeaders['Content-Length'] = upRes.headers['content-length'];
              }
              res.writeHead(upRes.statusCode || 200, outHeaders);
              if (isSse && typeof res.flushHeaders === 'function') res.flushHeaders();
              upRes.pipe(res);
              const cleanup = () => {
                try { upReq.destroy(); } catch {}
                try { upRes.destroy(); } catch {}
              };
              req.on('close', cleanup);
              res.on('close', cleanup);
            });
            upReq.on('error', (err) => {
              if (!res.headersSent) {
                res.writeHead(503, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({ error: 'WaCalls indisponível: ' + err.message }));
              } else {
                try { res.end(); } catch {}
              }
            });
            if (raw && raw.length) upReq.write(raw);
            upReq.end();
          }

          function attachWaCallsWs(req, socket, head, u) {
            if (!adminAuthorizedWithQuery(req, u)) {
              socket.write('HTTP/1.1 401 Unauthorized\r\n\r\n');
              return socket.destroy();
            }
            const sid = String(u.searchParams.get('sid') || '').trim();
            const callId = String(u.searchParams.get('callId') || '').trim();
            const clientId = String(u.searchParams.get('clientId') || '').trim();
            const safeId = /^[A-Za-z0-9._:@-]+(?![\s\S])/;
            if (!sid || !callId || !safeId.test(sid) || !safeId.test(callId)) {
              socket.write('HTTP/1.1 400 Bad Request\r\n\r\n');
              return socket.destroy();
            }
            const upstreamPath = '/api/sessions/' + encodeURIComponent(sid) + '/calls/' + encodeURIComponent(callId) + '/ws'
              + (clientId ? '?clientId=' + encodeURIComponent(clientId) : '');
            let connected = false;
            const upstream = net.connect(WACALLS_PORT, '127.0.0.1', () => {
              connected = true;
              try { socket.setNoDelay(true); } catch {}
              try { upstream.setNoDelay(true); } catch {}
              const hdrs = ['GET ' + upstreamPath + ' HTTP/1.1', 'Host: 127.0.0.1:' + WACALLS_PORT];
              let hasClientIdHeader = false;
              for (let i = 0; i < req.rawHeaders.length; i += 2) {
                const k = req.rawHeaders[i], v = req.rawHeaders[i + 1];
                if (/^(host|authorization)(?![\s\S])/i.test(k)) continue;
                if (/^x-client-id(?![\s\S])/i.test(k)) hasClientIdHeader = true;
                hdrs.push(k + ': ' + v);
              }
              if (clientId && !hasClientIdHeader) hdrs.push('X-Client-Id: ' + clientId);
              upstream.write(hdrs.join('\r\n') + '\r\n\r\n');
              if (head && head.length) upstream.write(head);
              upstream.pipe(socket);
              socket.pipe(upstream);
            });
            const close = () => {
              try { socket.destroy(); } catch {}
              try { upstream.destroy(); } catch {}
            };
            upstream.on('error', () => {
              if (!connected) {
                try { socket.write('HTTP/1.1 502 Bad Gateway\r\n\r\n'); } catch {}
              }
              close();
            });
            socket.on('error', close);
            upstream.on('close', close);
            socket.on('close', close);
          }

          function execCmd(bin, args, ms = 60000) {
            const isScript = bin.endsWith('.mjs') || bin.endsWith('.js');
            return new Promise((resolve) => {
              let out = '', err = '';
              let child;
              try { child = spawn(isScript ? process.execPath : bin, isScript ? [bin, ...args] : args, { cwd: WORKDIR, env, stdio: ['ignore', 'pipe', 'pipe'] }); }
              catch (e) { return resolve({ code: -1, out: '', err: e.message }); }
              const timer = setTimeout(() => child.kill('SIGTERM'), ms);
              child.stdout.on('data', (d) => { out += d; });
              child.stderr.on('data', (d) => { err += d; });
              child.on('error', (e) => { clearTimeout(timer); resolve({ code: -1, out, err: e.message }); });
              child.on('close', (code) => { clearTimeout(timer); resolve({ code, out: stripAnsi(out), err: stripAnsi(err) }); });
            });
          }

          let versionCache = { at: 0, claude: '', agy: '', oc: '', cp: '' };
          async function providersInfo() {
            if (Date.now() - versionCache.at > 10 * 60 * 1000) {
              const cl = await execCmd(CLAUDE_BIN, ['--version'], 20000);
              const ag = fs.existsSync(AGY_BIN) ? await execCmd(AGY_BIN, ['--version'], 20000) : null;
              const oc = await execCmd(OPENCODE_BIN, ['--version'], 20000);
              const cp = await execCmd(COPILOT_BIN, ['--version'], 20000);
              versionCache = {
                at: Date.now(),
                claude: cl.code === 0 ? cl.out.trim() : '',
                agy: ag && ag.code === 0 ? ag.out.trim() : '',
                oc: oc.code === 0 ? oc.out.trim() : '',
                cp: cp.code === 0 ? cp.out.split('\n')[0].trim() : '',
              };
            }
            const agyInstalled = fs.existsSync(AGY_BIN);
            const cat = agyInstalled ? await refreshAgyCatalog(false) : { models: [] };
            const compat = compatConfig();
            const cpTok = await getCopilotToken();
            return {
              defaultProvider: settings.defaultProvider || 'claude',
              providers: [
                { id: 'claude', name: PROVIDERS.claude, installed: Boolean(versionCache.claude), version: versionCache.claude,
                  auth: env.CLAUDE_CODE_OAUTH_TOKEN ? 'Assinatura (CLAUDE_CODE_OAUTH_TOKEN)' : env.ANTHROPIC_API_KEY ? 'API key (ANTHROPIC_API_KEY)' : 'sem credencial',
                  authKind: env.CLAUDE_CODE_OAUTH_TOKEN ? 'oauth' : env.ANTHROPIC_API_KEY ? 'apikey' : 'none',
                  models: CLAUDE_MODELS, efforts: EFFORTS, defaultModel: defModel(), defaultEffort: defEffort(),
                  envModel: ENV_MODEL, envEffort: ENV_EFFORT, permissionMode: PERMISSION_MODE },
                { id: 'antigravity', name: PROVIDERS.antigravity, installed: agyInstalled, version: versionCache.agy,
                  models: cat.models.map((g) => ({ id: g.base, label: g.label, efforts: g.efforts })) },
                { id: 'copilot', name: PROVIDERS.copilot, installed: Boolean(versionCache.cp), version: versionCache.cp,
                  auth: cpTok ? 'GitHub CLI / Token (autenticado)' : 'sem token (rode gh auth login ou copilot login)',
                  authKind: cpTok ? 'oauth' : 'none',
                  models: COPILOT_MODELS, efforts: EFFORTS, defaultModel: settings.copilotModel || COPILOT_DEFAULT_MODEL, permissionMode: PERMISSION_MODE },
                { id: 'opencode', name: PROVIDERS.opencode, installed: Boolean(versionCache.oc), version: versionCache.oc,
                  auth: 'Modelos gratuitos do OpenCode (sem chave)', authKind: 'none',
                  models: (await openCodeModels()).map((m) => ({ id: m, label: m })), defaultModel: settings.opencodeModel || OPENCODE_DEFAULT_MODEL },
                { id: 'openai_compat', name: PROVIDERS.openai_compat, installed: Boolean(compat.enabled), version: compat.baseUrl || 'não configurado',
                  auth: compat.apiKey ? 'Cofre AES-GCM (' + compat.secretName + ')' : 'sem chave (ex.: Ollama local)',
                  models: compat.models, defaultModel: compat.defaultModel },
              ],
            };
          }

          function chatView(id) {
            const c = chats[id] || {};
            const r = running.get(id);
            const lastRunAt = (c.runs && c.runs.at(-1) && c.runs.at(-1).at) || '';
            const unread = Boolean(isWeb(id) && !c.archived && lastRunAt && (!c.readAt || lastRunAt > c.readAt));
            return {
              id, kind: isWeb(id) ? 'web' : isDeleg(id) ? 'delegation' : 'whatsapp', members: Array.isArray(c.members) ? c.members : [], title: c.title || (isWeb(id) ? 'Conversa web' : id.split('@')[0]),
              provider: providerOf(c), providerSet: Boolean(c.provider), bot: botOf(c).id, effModel: runConfig(c).model || '', effEffort: runConfig(c).effort || '',
              model: c.model || '', effort: c.effort || '', agyModel: c.agyModel || '', agyEffort: c.agyEffort || '',
              session: c.session || '', agySession: c.agySession || '', ocSession: c.ocSession || '', olSession: c.olSession || '', cpSession: c.cpSession || '', created: c.created || '', readAt: c.readAt || '', unread,
              pinned: Boolean(c.pinned), archived: Boolean(c.archived),
              totals: c.totals || { runs: 0, cost: 0, ms: 0, errors: 0 }, runs: c.runs || [], lastUsage: c.lastUsage || null,
              running: r ? { started: r.started, prompt: r.prompt } : null,
              queued: Math.max(0, (pending.get(id) || 0) - (r ? 1 : 0)),
              pendingPrompt: pendingPromptFor(id) ? promptView(pendingPromptFor(id)) : null,
            };
          }

          // Claude MCP servers: user scope and local scope live in ~/.claude.json; project scope in WORKDIR/.mcp.json.
          function claudeMcpConfig() {
            const out = { user: {}, local: {}, project: {} };
            try {
              const j = JSON.parse(fs.readFileSync(path.join(env.HOME || '/tmp', '.claude.json'), 'utf8'));
              out.user = j.mcpServers || {};
              out.local = (j.projects && j.projects[WORKDIR] && j.projects[WORKDIR].mcpServers) || {};
            } catch {}
            try { out.project = JSON.parse(fs.readFileSync(path.join(WORKDIR, '.mcp.json'), 'utf8')).mcpServers || {}; } catch {}
            return out;
          }

          // agy 1.5+ keeps its MCP servers in ~/.gemini/config/mcp_config.json; the other paths are older layouts.
          const AGY_MCP_FILES = ['.gemini/config/mcp_config.json', '.gemini/antigravity/mcp_config.json', '.antigravity/mcp_config.json', '.antigravity/mcp.json', '.config/antigravity/mcp.json'];
          function agyMcpConfig() {
            for (const f of AGY_MCP_FILES) {
              const p = path.join(env.HOME || '/tmp', f);
              try { return { config: JSON.parse(fs.readFileSync(p, 'utf8')), configPath: p }; } catch {}
            }
            return { config: null, configPath: '' };
          }
          // The panel only needs to see which headers/env vars exist, never their values (tokens).
          function redactMcp(cfg) {
            const mask = (o) => Object.fromEntries(Object.keys(o || {}).map((k) => [k, '***']));
            const out = { ...cfg };
            if (cfg.headers && typeof cfg.headers === 'object') out.headers = mask(cfg.headers);
            if (cfg.env && typeof cfg.env === 'object') out.env = mask(cfg.env);
            if (cfg.environment && typeof cfg.environment === 'object') out.environment = mask(cfg.environment);
            if (cfg.oauth && typeof cfg.oauth === 'object') {
              out.oauth = { ...cfg.oauth };
              if (out.oauth.client_secret) out.oauth.client_secret = '***';
              if (out.oauth.clientSecret) out.oauth.clientSecret = '***';
            }
            return out;
          }
          const redactServers = (servers) => Object.fromEntries(Object.entries(servers || {}).map(([n, c]) => [n, redactMcp(c || {})]));

          function stripJsonComments(text) {
            let out = '', i = 0, n = text.length, inStr = false, esc = false;
            while (i < n) {
              const ch = text[i], nx = text[i + 1];
              if (inStr) {
                out += ch;
                if (esc) esc = false;
                else if (ch === '\\') esc = true;
                else if (ch === '"') inStr = false;
                i++;
              } else if (ch === '"') {
                inStr = true; out += ch; i++;
              } else if (ch === '/' && nx === '/') {
                i += 2;
                while (i < n && text[i] !== '\n') i++;
              } else if (ch === '/' && nx === '*') {
                i += 2;
                while (i < n && !(text[i] === '*' && text[i + 1] === '/')) i++;
                i += 2;
              } else {
                out += ch; i++;
              }
            }
            return out.replace(/,(\s*[}\]])/g, (_, tail) => tail);
          }
          function readJsoncFile(filePath) {
            try { return JSON.parse(stripJsonComments(fs.readFileSync(filePath, 'utf8'))); } catch { return null; }
          }
          function writeJsonAtomic(filePath, obj, mode = 0o600) {
            fs.mkdirSync(path.dirname(filePath), { recursive: true });
            const tmp = filePath + '.tmp.' + process.pid + '.' + Date.now() + '.' + Math.random().toString(36).slice(2, 8);
            fs.writeFileSync(tmp, JSON.stringify(obj, null, 2) + '\n', { mode });
            fs.renameSync(tmp, filePath);
          }
          async function isCliBinInstalled(bin, cacheKey) {
            if (!bin) return false;
            if (bin.includes('/') || bin.includes('\\')) return fs.existsSync(bin);
            if (cacheKey && versionCache[cacheKey]) return true;
            const r = await execCmd(bin, ['--version'], 10000);
            if (r.code === 0 && cacheKey) versionCache[cacheKey] = r.out.split('\n')[0].trim() || 'ok';
            return r.code === 0;
          }

          async function agyMcp() {
            if (!fs.existsSync(AGY_BIN)) return { installed: false };
            const r = await execCmd(AGY_BIN, ['mcp', 'list'], 30000);
            const { config, configPath } = agyMcpConfig();
            const servers = redactServers(config && config.mcpServers);
            return { installed: true, list: (r.out + (r.code ? '\n' + r.err : '')).trim(), config: config ? { ...config, mcpServers: servers } : null, configPath, servers };
          }

          // GitHub Copilot CLI MCP servers: user scope in ~/.copilot/mcp-config.json; workspace in .mcp.json or .github/mcp.json.
          function copilotMcpPath() {
            return path.join(env.HOME || '/tmp', '.copilot', 'mcp-config.json');
          }
          function copilotMcpConfig() {
            const configPath = copilotMcpPath();
            const config = readJsoncFile(configPath);
            const user = (config && config.mcpServers && typeof config.mcpServers === 'object') ? config.mcpServers : {};
            const workspace = {};
            for (const rel of ['.mcp.json', path.join('.github', 'mcp.json')]) {
              const j = readJsoncFile(path.join(WORKDIR, rel));
              if (j && j.mcpServers && typeof j.mcpServers === 'object') Object.assign(workspace, j.mcpServers);
            }
            return { config, configPath, user, workspace };
          }
          async function copilotMcp() {
            const installed = await isCliBinInstalled(COPILOT_BIN, 'cp');
            const { config, configPath, user, workspace } = copilotMcpConfig();
            const servers = redactServers(user);
            const wsRedacted = redactServers(workspace);
            const redactedConfig = config ? { ...config, mcpServers: servers } : null;
            if (!installed) return { installed: false, configPath, config: redactedConfig, servers, workspace: wsRedacted };
            return { installed: true, configPath, config: redactedConfig, servers, workspace: wsRedacted };
          }

          // OpenCode MCP servers: ~/.config/opencode/opencode.json (+ opencode.jsonc), under mcp.servers (current) or legacy mcp.<name>.
          function opencodeConfigDir() {
            return path.join(env.XDG_CONFIG_HOME || path.join(env.HOME || '/tmp', '.config'), 'opencode');
          }
          function isOpencodeMcpEntry(v) {
            if (!v || typeof v !== 'object' || Array.isArray(v)) return false;
            return v.type === 'local' || v.type === 'remote' || Array.isArray(v.command) || typeof v.url === 'string' || typeof v.enabled === 'boolean' || typeof v.disabled === 'boolean';
          }
          function opencodeMcpExtract(obj) {
            const out = {};
            const m = obj && obj.mcp;
            if (!m || typeof m !== 'object') return out;
            for (const [k, v] of Object.entries(m)) {
              if (k === 'servers' || k === 'timeout') continue;
              if (isOpencodeMcpEntry(v)) out[k] = v;
            }
            if (m.servers && typeof m.servers === 'object') {
              for (const [k, v] of Object.entries(m.servers)) {
                if (isOpencodeMcpEntry(v)) out[k] = v;
              }
            }
            return out;
          }
          function redactOpencodeConfig(obj) {
            if (!obj || typeof obj !== 'object') return null;
            const clone = { ...obj };
            if (clone.mcp && typeof clone.mcp === 'object') {
              const m = { ...clone.mcp };
              for (const [k, v] of Object.entries(m)) {
                if (k === 'servers' && v && typeof v === 'object') {
                  m.servers = redactServers(v);
                } else if (k !== 'timeout' && isOpencodeMcpEntry(v)) {
                  m[k] = redactMcp(v);
                }
              }
              clone.mcp = m;
            }
            return clone;
          }
          function opencodeMcpConfig() {
            const dir = opencodeConfigDir();
            const jsonPath = path.join(dir, 'opencode.json');
            const jsoncPath = path.join(dir, 'opencode.jsonc');
            const jsonObj = readJsoncFile(jsonPath);
            const jsoncObj = readJsoncFile(jsoncPath);
            const servers = { ...opencodeMcpExtract(jsonObj), ...opencodeMcpExtract(jsoncObj) };
            const project = {};
            for (const name of ['opencode.json', 'opencode.jsonc']) {
              const pj = readJsoncFile(path.join(WORKDIR, name));
              if (pj) Object.assign(project, opencodeMcpExtract(pj));
            }
            const configPath = fs.existsSync(jsonPath) || !fs.existsSync(jsoncPath) ? jsonPath : jsoncPath;
            const config = configPath === jsonPath ? jsonObj : jsoncObj;
            return { config, configPath, jsonPath, jsoncPath, servers, project };
          }
          async function opencodeMcp() {
            const installed = await isCliBinInstalled(OPENCODE_BIN, 'oc');
            const { config, configPath, servers, project } = opencodeMcpConfig();
            const redactedServers = redactServers(servers);
            const redactedProject = redactServers(project);
            const redactedConfig = redactOpencodeConfig(config);
            if (!installed) return { installed: false, configPath, config: redactedConfig, servers: redactedServers, project: redactedProject };
            return { installed: true, configPath, config: redactedConfig, servers: redactedServers, project: redactedProject };
          }

          // agy, copilot and opencode health check via MCP JSON-RPC initialize handshake:
          // spawn the stdio command (or POST to the URL) and wait for the initialize answer.
          const MCP_INIT = { jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'agent-control', version: '1' } } };
          function probeStdio(cfg, ms) {
            return new Promise((resolve) => {
              let child, buf = '', errBuf = '', done = false;
              const finish = (r) => { if (done) return; done = true; clearTimeout(timer); try { child && child.kill('SIGTERM'); } catch {} resolve(r); };
              const timer = setTimeout(() => finish({ ok: false, error: 'sem resposta em ' + Math.round(ms / 1000) + 's' + (errBuf.trim() ? ': ' + errBuf.trim().split('\n').pop() : '') }), ms);
              try { child = spawn(cfg.command, cfg.args || [], { cwd: WORKDIR, env: buildChildEnv(cfg.env || {}, false), stdio: ['pipe', 'pipe', 'pipe'] }); }
              catch (e) { return finish({ ok: false, error: e.message }); }
              child.on('error', (e) => finish({ ok: false, error: e.message }));
              child.on('close', (code) => finish({ ok: false, error: 'processo saiu (código ' + code + ')' + (errBuf.trim() ? ': ' + errBuf.trim().split('\n').pop() : '') }));
              child.stderr.on('data', (d) => { errBuf = (errBuf + d).slice(-2000); });
              child.stdout.on('data', (d) => {
                buf += d;
                let i;
                while ((i = buf.indexOf('\n')) >= 0) {
                  const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
                  try {
                    const j = JSON.parse(line);
                    if (j.id === 1) finish(j.error ? { ok: false, error: j.error.message || 'erro no initialize' } : { ok: true, server: j.result && j.result.serverInfo });
                  } catch {}
                }
              });
              child.stdin.on('error', () => {});
              child.stdin.write(JSON.stringify(MCP_INIT) + '\n');
            });
          }
          async function probeHttp(cfg, ms) {
            try {
              const r = await fetch(cfg.serverUrl || cfg.url, {
                method: 'POST', signal: AbortSignal.timeout(ms),
                headers: { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', ...(cfg.headers || {}) },
                body: JSON.stringify(MCP_INIT),
              });
              const text = await r.text();
              if (!r.ok) return { ok: false, error: 'HTTP ' + r.status + (r.status === 401 || r.status === 403 ? ' (precisa de autenticação)' : '') };
              const m = text.match(/\{[\s\S]*\}/);
              const j = m ? JSON.parse(m[0]) : {};
              return j.error ? { ok: false, error: j.error.message || 'erro no initialize' } : { ok: true, server: j.result && j.result.serverInfo };
            } catch (e) { return { ok: false, error: e.name === 'TimeoutError' ? 'sem resposta em ' + Math.round(ms / 1000) + 's' : e.message }; }
          }
          async function agyMcpStatus() {
            if (!fs.existsSync(AGY_BIN)) return { output: 'agy não está instalado', code: 1, servers: {} };
            const { config } = agyMcpConfig();
            const entries = Object.entries((config && config.mcpServers) || {});
            const results = await Promise.all(entries.map(async ([n, cfg]) => {
              if (cfg.disabled) return [n, { ok: false, disabled: true, status: 'Disabled' }];
              const r = cfg.command ? await probeStdio(cfg, 45000) : await probeHttp(cfg, 20000);
              return [n, { ...r, status: r.ok ? '✔ Connected' : '✗ Failed: ' + r.error }];
            }));
            const servers = Object.fromEntries(results);
            const output = results.map(([n, r]) => {
              const cfg = config.mcpServers[n];
              return n + ': ' + (cfg.command ? [cfg.command, ...(cfg.args || [])].join(' ') : (cfg.serverUrl || cfg.url) + ' (HTTP)') + ' - ' + r.status;
            }).join('\n');
            return { output: output || '(nenhum MCP configurado no Antigravity)', code: 0, servers };
          }
          async function copilotMcpStatus() {
            if (!(await isCliBinInstalled(COPILOT_BIN, 'cp'))) return { output: 'copilot não está instalado', code: 1, servers: {} };
            const { user, workspace } = copilotMcpConfig();
            const all = { ...workspace, ...user };
            const entries = Object.entries(all);
            const results = await Promise.all(entries.map(async ([n, cfg]) => {
              if (cfg.disabled === true || cfg.enabled === false) return [n, { ok: false, disabled: true, status: 'Disabled' }];
              const r = cfg.command ? await probeStdio(cfg, 45000) : await probeHttp(cfg, 20000);
              return [n, { ...r, status: r.ok ? '✔ Connected' : '✗ Failed: ' + r.error }];
            }));
            const servers = Object.fromEntries(results);
            const output = results.map(([n, r]) => {
              const cfg = all[n];
              return n + ': ' + (cfg.command ? [cfg.command, ...(cfg.args || [])].join(' ') : (cfg.url || cfg.serverUrl || '') + ' (HTTP)') + ' - ' + r.status;
            }).join('\n');
            return { output: output || '(nenhum MCP configurado no GitHub Copilot)', code: 0, servers };
          }
          async function opencodeMcpStatus() {
            if (!(await isCliBinInstalled(OPENCODE_BIN, 'oc'))) return { output: 'opencode não está instalado', code: 1, servers: {} };
            const { servers: userServers, project } = opencodeMcpConfig();
            const all = { ...project, ...userServers };
            const entries = Object.entries(all);
            const results = await Promise.all(entries.map(async ([n, cfg]) => {
              if (cfg.disabled === true || cfg.enabled === false) return [n, { ok: false, disabled: true, status: 'Disabled' }];
              let r;
              if (Array.isArray(cfg.command) && cfg.command.length) {
                r = await probeStdio({ command: cfg.command[0], args: cfg.command.slice(1), env: cfg.environment || cfg.env || {} }, 45000);
              } else if (typeof cfg.command === 'string' && cfg.command) {
                r = await probeStdio({ command: cfg.command, args: cfg.args || [], env: cfg.environment || cfg.env || {} }, 45000);
              } else if (cfg.url || cfg.serverUrl) {
                r = await probeHttp({ url: cfg.url || cfg.serverUrl, headers: cfg.headers || {} }, 20000);
              } else {
                r = { ok: false, error: 'configuração incompleta' };
              }
              return [n, { ...r, status: r.ok ? '✔ Connected' : '✗ Failed: ' + r.error }];
            }));
            const servers = Object.fromEntries(results);
            const output = results.map(([n, r]) => {
              const cfg = all[n];
              const desc = Array.isArray(cfg.command) ? cfg.command.join(' ') : (cfg.command ? [cfg.command, ...(cfg.args || [])].join(' ') : (cfg.url || cfg.serverUrl || '') + ' (HTTP)');
              return n + ': ' + desc + ' - ' + r.status;
            }).join('\n');
            return { output: output || '(nenhum MCP configurado no OpenCode)', code: 0, servers };
          }

          const validName = (n) => /^[A-Za-z0-9_.-]{1,64}(?![\s\S])/.test(String(n || ''));
          const SCHEMA_KEY = String.fromCharCode(36) + 'schema';
          async function addMcp(b) {
            if (!validName(b.name)) throw new Error('nome inválido (use letras, números, _ . -)');
            const provider = b.provider || 'claude';
            if (!['claude', 'antigravity', 'copilot', 'opencode'].includes(provider)) throw new Error('provedor MCP inválido');
            const transport = b.transport || (b.url ? 'http' : 'stdio');
            if (transport === 'stdio' && !b.command) throw new Error('informe o comando');
            if (transport !== 'stdio' && !b.url) throw new Error('informe a URL');
            if (provider === 'copilot') {
              if (!(await isCliBinInstalled(COPILOT_BIN, 'cp'))) throw new Error('copilot não está instalado');
              const cfgPath = copilotMcpPath();
              const existing = readJsoncFile(cfgPath);
              const root = existing && typeof existing === 'object' && !Array.isArray(existing) ? existing : {};
              const mcpServers = root.mcpServers && typeof root.mcpServers === 'object' ? { ...root.mcpServers } : {};
              const entry = transport === 'stdio'
                ? { type: 'local', command: b.command, args: Array.isArray(b.args) ? b.args : [], tools: ['*'], ...(b.env && Object.keys(b.env).length ? { env: b.env } : {}) }
                : { type: transport === 'sse' ? 'sse' : 'http', url: b.url, tools: ['*'], ...(b.headers && Object.keys(b.headers).length ? { headers: b.headers } : {}) };
              mcpServers[b.name] = entry;
              writeJsonAtomic(cfgPath, { ...root, mcpServers }, 0o600);
              audit({ action: 'mcp-add', provider, name: b.name, transport, ok: true });
              return { ok: true, output: 'Adicionado em ' + cfgPath };
            }
            if (provider === 'opencode') {
              if (!(await isCliBinInstalled(OPENCODE_BIN, 'oc'))) throw new Error('opencode não está instalado');
              const { jsonPath } = opencodeMcpConfig();
              const existing = readJsoncFile(jsonPath);
              const root = existing && typeof existing === 'object' && !Array.isArray(existing)
                ? { ...existing }
                : { [SCHEMA_KEY]: 'https://opencode.ai/config.json' };
              const mcpObj = root.mcp && typeof root.mcp === 'object' && !Array.isArray(root.mcp) ? { ...root.mcp } : {};
              const servers = mcpObj.servers && typeof mcpObj.servers === 'object' && !Array.isArray(mcpObj.servers) ? { ...mcpObj.servers } : {};
              if (b.name !== 'servers' && b.name !== 'timeout' && Object.prototype.hasOwnProperty.call(mcpObj, b.name)) delete mcpObj[b.name];
              const entry = transport === 'stdio'
                ? { type: 'local', command: [b.command, ...(Array.isArray(b.args) ? b.args : [])], ...(b.env && Object.keys(b.env).length ? { environment: b.env } : {}) }
                : { type: 'remote', url: b.url, ...(b.headers && Object.keys(b.headers).length ? { headers: b.headers } : {}) };
              servers[b.name] = entry;
              mcpObj.servers = servers;
              root.mcp = mcpObj;
              writeJsonAtomic(jsonPath, root, 0o600);
              audit({ action: 'mcp-add', provider, name: b.name, transport, ok: true });
              return { ok: true, output: 'Adicionado em ' + jsonPath };
            }
            let r;
            if (provider === 'claude') {
              const cfg = transport === 'stdio'
                ? { type: 'stdio', command: b.command, args: b.args || [], env: b.env || {} }
                : { type: transport, url: b.url, headers: b.headers || {} };
              r = await execCmd(CLAUDE_BIN, ['mcp', 'add-json', '-s', b.scope || 'user', b.name, JSON.stringify(cfg)], 60000);
            } else {
              if (!fs.existsSync(AGY_BIN)) throw new Error('agy não está instalado');
              // Flags have to come before the name; `--` keeps commands/args that start with '-' intact.
              const flags = [];
              if (transport === 'stdio') for (const [k, v] of Object.entries(b.env || {})) flags.push('--env', k + '=' + v);
              else for (const [k, v] of Object.entries(b.headers || {})) flags.push('--header', k + ': ' + v);
              r = await execCmd(AGY_BIN, transport === 'stdio' ? ['mcp', 'add', ...flags, '--', b.name, b.command, ...(b.args || [])] : ['mcp', 'add', ...flags, '--', b.name, b.url], 60000);
            }
            audit({ action: 'mcp-add', provider, name: b.name, transport, ok: r.code === 0 });
            if (r.code !== 0) throw new Error((r.err || r.out || 'falhou com código ' + r.code).trim().slice(0, 800));
            return { ok: true, output: (r.out + r.err).trim() };
          }
          async function removeMcp(provider, name, scope) {
            if (!validName(name)) throw new Error('nome inválido');
            if (!['claude', 'antigravity', 'copilot', 'opencode'].includes(provider)) throw new Error('provedor MCP inválido');
            if (provider === 'copilot') {
              const cfgPath = copilotMcpPath();
              const existing = readJsoncFile(cfgPath);
              if (!existing || !existing.mcpServers || !Object.prototype.hasOwnProperty.call(existing.mcpServers, name)) {
                audit({ action: 'mcp-remove', provider, name, ok: false });
                throw new Error('MCP "' + name + '" não encontrado em ' + cfgPath);
              }
              const mcpServers = { ...existing.mcpServers };
              delete mcpServers[name];
              writeJsonAtomic(cfgPath, { ...existing, mcpServers }, 0o600);
              audit({ action: 'mcp-remove', provider, name, ok: true });
              return { ok: true, output: 'Removido de ' + cfgPath };
            }
            if (provider === 'opencode') {
              const { jsonPath, jsoncPath } = opencodeMcpConfig();
              const removedFrom = [];
              for (const p of [jsonPath, jsoncPath]) {
                const obj = readJsoncFile(p);
                if (!obj || !obj.mcp || typeof obj.mcp !== 'object') continue;
                let changed = false;
                const mcpObj = { ...obj.mcp };
                if (mcpObj.servers && typeof mcpObj.servers === 'object' && Object.prototype.hasOwnProperty.call(mcpObj.servers, name)) {
                  const servers = { ...mcpObj.servers };
                  delete servers[name];
                  mcpObj.servers = servers;
                  changed = true;
                }
                if (name !== 'servers' && name !== 'timeout' && Object.prototype.hasOwnProperty.call(mcpObj, name)) {
                  delete mcpObj[name];
                  changed = true;
                }
                if (changed) {
                  writeJsonAtomic(p, { ...obj, mcp: mcpObj }, 0o600);
                  removedFrom.push(p);
                }
              }
              if (!removedFrom.length) {
                audit({ action: 'mcp-remove', provider, name, ok: false });
                throw new Error('MCP "' + name + '" não encontrado na configuração do OpenCode');
              }
              audit({ action: 'mcp-remove', provider, name, ok: true });
              return { ok: true, output: 'Removido de ' + removedFrom.join(', ') };
            }
            const r = provider === 'antigravity'
              ? await execCmd(AGY_BIN, ['mcp', 'remove', name], 60000)
              : await execCmd(CLAUDE_BIN, ['mcp', 'remove', '-s', scope || 'user', name], 60000);
            audit({ action: 'mcp-remove', provider, name, ok: r.code === 0 });
            if (r.code !== 0) throw new Error((r.err || r.out || 'falhou com código ' + r.code).trim().slice(0, 800));
            return { ok: true, output: (r.out + r.err).trim() };
          }

          function readAudit(n) {
            try {
              return fs.readFileSync(AUDIT_FILE, 'utf8').trim().split('\n').slice(-n).reverse()
                .map((l) => { try { return JSON.parse(l); } catch { return { raw: l }; } });
            } catch { return []; }
          }

          async function handleAdmin(req, res, u, raw) {
            const send = (code, obj) => { res.writeHead(code, { 'Content-Type': 'application/json' }); res.end(JSON.stringify(obj)); };
            if (!adminAuthorized(req)) return send(ADMIN_TOKEN ? 401 : 503, { error: ADMIN_TOKEN ? 'não autorizado' : 'BRIDGE_ADMIN_TOKEN não configurado' });
            const parts = u.pathname.split('/').slice(2).map(decodeURIComponent); // after /admin
            const m = req.method;
            if (parts[0] === 'wacalls') {
              if (parts[1] === 'status' && !parts[2] && m === 'GET') return send(200, await wacallsStatus());
              if (parts[1] === 'start' && !parts[2] && m === 'POST') return send(200, await startWaCalls());
              if (parts[1] === 'stop' && !parts[2] && m === 'POST') return send(200, await stopWaCalls());
              if (parts[1] === 'api') {
                const callStartMatch = u.pathname.match(/^\/admin\/wacalls\/api\/sessions\/([^/]+)\/calls\/?(?![\s\S])/);
                if (m === 'POST' && callStartMatch) {
                  let callBody = {};
                  if (raw.length) {
                    try { callBody = JSON.parse(raw.toString('utf8')); }
                    catch { return send(400, { error: 'JSON inválido' }); }
                  }
                  const sid = decodeURIComponent(callStartMatch[1]);
                  const phone = String((callBody && callBody.phone) || '').trim();
                  if (!allowThirdPartySend()) {
                    try {
                      await assertWhatsAppRecipientAllowed(phone);
                    } catch (err) {
                      audit({ action: 'wacalls-call-blocked', sid, phone, reason: err.message, via: 'panel' });
                      return send(403, { error: err.message });
                    }
                  }
                  audit({ action: 'wacalls-call-start', sid, phone, via: 'panel' });
                }
                return proxyWaCallsHttp(req, res, u, raw);
              }
              return send(404, { error: 'rota não encontrada' });
            }
