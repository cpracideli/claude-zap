                tokens: m.tokens, cacheRead: m.cacheRead, totalTokens: m.totalTokens,
                costUsd: Math.round(m.costUsd * 1000000) / 1000000,
                messages: m.messages, sessionsCount: m.sessions.size, models: [...m.models].sort(),
              };
            }
            const value = { days: cleanDays, since: minTs ? new Date(minTs).toISOString() : null, lastOkAt, hasPaid, hasAccount, monthByYm, events };
            ocDbCache = { sig, value };
            return value;
          }

          let ocLogCache = { sig: '', value: null };
          function openCodeLogLimit() {
            const dataRoot = env.XDG_DATA_HOME || path.join(HOME_DIR, '.local', 'share');
            const logPath = path.join(dataRoot, 'opencode', 'log', 'opencode.log');
            let st;
            try { st = fs.statSync(logPath); } catch { return null; }
            const sig = st.size + ':' + st.mtimeMs;
            if (ocLogCache.sig === sig) return ocLogCache.value;
            let found = null;
            let fd;
            try {
              const bytesToRead = Math.min(st.size, 65536);
              if (bytesToRead > 0) {
                fd = fs.openSync(logPath, 'r');
                const buf = Buffer.alloc(bytesToRead);
                fs.readSync(fd, buf, 0, bytesToRead, st.size - bytesToRead);
                const lines = buf.toString('utf8').split('\n');
                for (let i = lines.length - 1; i >= 0; i--) {
                  const line = lines[i];
                  if (!/level=ERROR/i.test(line) || !OPENCODE_LIMIT_RE.test(line)) continue;
                  const tsM = line.match(/timestamp=(\S+)/);
                  const modM = line.match(/modelID=(\S+)/);
                  const errM = line.match(/error\.error="([^"]+)"/);
                  found = {
                    at: tsM ? tsM[1] : new Date(st.mtimeMs).toISOString(),
                    model: modM ? modM[1] : '',
                    message: errM ? errM[1] : 'Free usage limit reached',
                  };
                  break;
                }
              }
            } catch {}
            finally { if (fd !== undefined) { try { fs.closeSync(fd); } catch {} } }
            ocLogCache = { sig, value: found };
            return found;
          }

          // Estimated usage meter for the free tier (no official quota API): rolling window, limit calibrated from
          // how much was used right before each past "free usage limit" streak (median of the samples).
          const OC_EST_WINDOW_MS = 5 * 3600000;
          let ocHitsCache = { sig: '', value: [] };
          function openCodeLimitHits() {
            const dataRoot = env.XDG_DATA_HOME || path.join(HOME_DIR, '.local', 'share');
            const logPath = path.join(dataRoot, 'opencode', 'log', 'opencode.log');
            let st; try { st = fs.statSync(logPath); } catch { return []; }
            const sig = st.size + ':' + st.mtimeMs;
            if (ocHitsCache.sig === sig) return ocHitsCache.value;
            const out = [];
            try {
              for (const line of fs.readFileSync(logPath, 'utf8').split('\n')) {
                if (!/level=ERROR/i.test(line) || !OPENCODE_LIMIT_RE.test(line)) continue;
                const m = line.match(/timestamp=(\S+)/); const t = m ? Date.parse(m[1]) : NaN;
                if (Number.isFinite(t)) out.push(t);
              }
            } catch {}
            out.sort((a, b) => a - b);
            ocHitsCache = { sig, value: out };
            return out;
          }
          function openCodeEstimate(events, rateLimited, now = Date.now()) {
            if (!Array.isArray(events) || !events.length) return null;
            const countIn = (from, to) => { let n = 0, tok = 0; for (const [t, k] of events) if (t >= from && t < to) { n++; tok += k; } return { n, tok }; };
            const samples = [];
            let prev = 0;
            for (const h of openCodeLimitHits()) {
              if (h - prev > OC_EST_WINDOW_MS) { const c = countIn(h - OC_EST_WINDOW_MS, h); if (c.n >= 5) samples.push(c.n); }
              prev = h;
            }
            const cur = countIn(now - OC_EST_WINDOW_MS, now + 1);
            if (!samples.length) return { estimated: true, windowHours: OC_EST_WINDOW_MS / 3600000, used: cur.n, tokens: cur.tok, limit: null, percent: rateLimited && cur.n > 0 ? 100 : null, samples: 0 };
            samples.sort((a, b) => a - b);
            const limit = samples[Math.floor(samples.length / 2)];
            const percent = (rateLimited && cur.n > 0) ? 100 : Math.min(100, Math.round((cur.n / limit) * 100));
            const oldest = events.filter(([t]) => t >= now - OC_EST_WINDOW_MS).reduce((a, [t]) => Math.min(a, t), Infinity);
            return { estimated: true, windowHours: OC_EST_WINDOW_MS / 3600000, used: cur.n, tokens: cur.tok, limit, percent, samples: samples.length,
              freesAt: Number.isFinite(oldest) && cur.n > 0 ? new Date(oldest + OC_EST_WINDOW_MS).toISOString() : null };
          }

          function openCodeSummary(ocDb, ocMonth, installed) {
            const logLim = openCodeLogLimit();
            const candidates = [openCodeLastLimit, logLim].filter((x) => x && x.at);
            candidates.sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
            const lim = candidates[0] || null;
            const lastOkAt = Math.max(openCodeLastOkAt, ocDb.lastOkAt || 0);
            const limMs = lim && lim.at ? Date.parse(lim.at) : NaN;
            const rateLimited = Boolean(lim && Number.isFinite(limMs) && limMs >= lastOkAt && (Date.now() - limMs) < 24 * 3600000);
            const hasPaid = Boolean(ocDb.hasPaid || (ocMonth && ocMonth.costUsd > 0));
            return {
              installed,
              plan: hasPaid ? 'paid' : 'free',
              planLabel: hasPaid ? 'Pago / API' : 'Gratuito',
              hasAccount: Boolean(ocDb.hasAccount),
              status: rateLimited ? 'limit_reached' : 'ok',
              rateLimited,
              error: rateLimited ? ('Limite gratuito do OpenCode atingido' + (lim.model ? ' (' + lim.model + ')' : '') + ' — aguarde renovação ou use outro provedor') : null,
              limitHitAt: rateLimited ? lim.at : null,
              lastActivityAt: lastOkAt ? new Date(lastOkAt).toISOString() : null,
              fetchedAt: new Date().toISOString(),
              month: ocMonth,
              estimate: openCodeEstimate(ocDb.events, rateLimited),
            };
          }

          // Claude Code transcripts, parsed once per file version (size + mtime).
          const transcriptCache = new Map();
          function claudeTranscriptDays() {
            const root = path.join(HOME_DIR, '.claude', 'projects');
            const files = [];
            const walk = (d) => { let es = []; try { es = fs.readdirSync(d, { withFileTypes: true }); } catch {} for (const e of es) { const f = path.join(d, e.name); if (e.isDirectory()) walk(f); else if (e.name.endsWith('.jsonl')) files.push(f); } };
            walk(root);
            const days = {};
            for (const f of files) {
              let st; try { st = fs.statSync(f); } catch { continue; }
              const sig = st.size + ':' + st.mtimeMs;
              let c = transcriptCache.get(f);
              if (!c || c.sig !== sig) {
                const per = {}, seen = new Set();
                let text = ''; try { text = fs.readFileSync(f, 'utf8'); } catch {}
                for (const line of text.split('\n')) {
                  if (!line.includes('"usage"') || !line.includes('"assistant"')) continue;
                  let j; try { j = JSON.parse(line); } catch { continue; }
                  const msg = j.message, u = msg?.usage;
                  if (j.type !== 'assistant' || !u || !j.timestamp || (msg.id && seen.has(msg.id))) continue;
                  if (msg.id) seen.add(msg.id);
                  if (msg.model === '<synthetic>') continue;
                  const d = (per[dayKey(j.timestamp)] ||= { in: 0, out: 0, cacheRead: 0, msgs: 0 });
                  d.in += (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0); d.out += u.output_tokens || 0; d.cacheRead += u.cache_read_input_tokens || 0; d.msgs += 1;
                }
                c = { sig, per }; transcriptCache.set(f, c);
              }
              for (const [k, d] of Object.entries(c.per)) { const t = (days[k] ||= { in: 0, out: 0, cacheRead: 0, msgs: 0 }); t.in += d.in; t.out += d.out; t.cacheRead += d.cacheRead; t.msgs += d.msgs; }
            }
            return days;
          }

          function monthlySpendSummary() {
            const now = new Date();
            const ym = dayKey(now).slice(0, 7); // YYYY-MM
            const dayOfMonth = Math.max(1, Number(dayKey(now).slice(8, 10)) || 1);
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            let monthSpendUsd = 0, monthRuns = 0;
            try {
              for (const line of fs.readFileSync(USAGE_FILE, 'utf8').split('\n')) {
                if (!line) continue;
                let j; try { j = JSON.parse(line); } catch { continue; }
                if (j.at && dayKey(j.at).startsWith(ym)) {
                  const lineCost = (j.provider === 'antigravity' && !(Number(j.cost) > 0))
                    ? estimateAgyCost(j.model, { input_tokens: j.in, output_tokens: j.out, cache_read_tokens: j.cacheRead })
                    : (Number(j.cost) || 0);
                  monthSpendUsd += lineCost;
                  monthRuns += 1;
                }
              }
            } catch {}
            const sp = settings.spending || {};
            const monthlyLimitUsd = Number(sp.monthlyLimitUsd || 0);
            const taskAlertUsd = Number(sp.taskAlertUsd || 0);
            const monthForecastUsd = Math.round(((monthSpendUsd / dayOfMonth) * daysInMonth) * 10000) / 10000;
            return {
              month: ym,
              monthSpendUsd: Math.round(monthSpendUsd * 10000) / 10000,
              monthForecastUsd,
              monthRuns,
              monthlyLimitUsd,
              taskAlertUsd,
              pauseRoutinesOnLimit: Boolean(sp.pauseRoutinesOnLimit),
              limitReached: monthlyLimitUsd > 0 && monthSpendUsd >= monthlyLimitUsd,
            };
          }
          function estimateRoutineMonthlyRuns(s) {
            if (s.paused) return 0;
            if (s.cron) {
              const [mi, h, dom, , dow] = String(s.cron).trim().split(/\s+/);
              const countPart = (f, size) => {
                if (f === '*') return size;
                if (f.startsWith('*/')) return Math.max(1, Math.floor(size / (Number(f.slice(2)) || 1)));
                return f.split(',').length;
              };
              const perDay = countPart(mi, 60) * countPart(h, 24);
              const daysPerMonth = dom !== '*' ? countPart(dom, 30) : dow !== '*' ? Math.round((countPart(dow, 7) / 7) * 30) : 30;
              return Math.min(perDay * daysPerMonth, 45000);
            }
            if (s.watch && s.watch.every) return Math.round((30 * 1440) / Math.max(5, s.watch.every) * 0.1);
            return 0;
          }
          function routineForecasts() {
            return schedules.map((s) => {
              const runs = (routineRuns[s.id] || []).filter((x) => typeof x.cost === 'number' && x.cost > 0);
              const avgCost = runs.length ? runs.reduce((a, x) => a + x.cost, 0) / runs.length : 0;
              const estRuns = estimateRoutineMonthlyRuns(s);
              return {
                id: s.id, description: s.description, paused: Boolean(s.paused),
                avgCostUsd: Math.round(avgCost * 10000) / 10000,
                estMonthlyRuns: estRuns,
                projectedMonthlyUsd: Math.round(avgCost * estRuns * 10000) / 10000,
              };
            });
          }
          function auditCsv(limit = 500) {
            const esc = (v) => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
            const rows = readAudit(limit).reverse();
            const header = ['timestamp', 'action', 'bot', 'chatId', 'decision', 'reason', 'cost_usd', 'details'].join(',');
            const lines = rows.map((r) => {
              const ts = r.at ? new Date(r.at).toLocaleString('sv-SE', { timeZone: TZ }) : '';
              const extra = { ...r };
              for (const k of ['at', 'action', 'bot', 'chatId', 'decision', 'reason', 'cost']) delete extra[k];
              return [ts, r.action || '', r.bot || '', r.chatId || r.to || '', r.decision || '', r.reason || '', r.cost ?? '', JSON.stringify(extra)].map(esc).join(',');
            });
            return [header, ...lines].join('\n') + '\n';
          }

          async function usageReport(nDays = 56) {
            const [claude, antigravity, copilotLim, ocInstalled] = await Promise.all([
              claudeLimits(),
              agyLimits(),
              copilotLimits(),
              isCliBinInstalled(OPENCODE_BIN, 'oc'),
            ]);
            const tdays = claudeTranscriptDays();
            const cpDb = copilotDbHistory();
            const ocDb = openCodeDbHistory();
            const log = {};
            const firstByProvider = {};
            try {
              for (const line of fs.readFileSync(USAGE_FILE, 'utf8').split('\n')) {
                if (!line) continue; let j; try { j = JSON.parse(line); } catch { continue; }
                if (!j.at || !j.provider) continue;
                if (!firstByProvider[j.provider]) firstByProvider[j.provider] = j.at;
