                cur.updated = new Date().toISOString();
                saveTickets();
              } else {
                cur.autoFailCount = 0;
                if (cur.goal && cur.status === 'in_progress' && !cur.nextCheckAt && cur.checkIntervalMin > 0 && (!cur.maxRuns || (cur.runCount || 0) < cur.maxRuns)) {
