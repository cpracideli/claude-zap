              const ms = r.usage ? r.usage.ms : Date.now() - started;
              recordRun(cid, { prompt: ('Ticket #' + t.id + ': ' + t.title).slice(0, 80), ms, cost: r.usage ? r.usage.cost : 0, error: r.error });
