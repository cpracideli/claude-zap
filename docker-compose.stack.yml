                      body: JSON.stringify({ to: [d.to], subject: d.subject || '(sem assunto)', text: d.body }),
                      signal: AbortSignal.timeout(30000),
                    });
                    if (!r.ok) {
                      const errTxt = await r.text().catch(() => '');
                      throw new Error('AgentMail HTTP ' + r.status + (errTxt ? ': ' + errTxt.slice(0, 200) : ''));
                    }
                  } else {
                    throw new Error('Envio de e-mail não configurado (configure AGENTMAIL_API_KEY + AGENTMAIL_INBOX ou instale ~/bin/gmail.py)');
                  }
                }
              }
              d.status = 'sent';
              d.sentAt = new Date().toISOString();
              d.updated = d.sentAt;
              delete d.error;
              saveDrafts();
              audit({ action: 'draft-send', id: d.id, channel: d.channel, to: d.to, via });
              return d;
            } catch (e) {
              d.status = 'error';
              d.error = e.message;
              d.updated = new Date().toISOString();
              saveDrafts();
              audit({ action: 'draft-error', id: d.id, error: e.message });
              const chLabel = d.channel === 'email' ? 'E-mail' : 'WhatsApp';
              const errLines = [
                '⚠️ *Falha ao enviar rascunho*',
                '• *Canal:* ' + chLabel,
                '• *Para:* ' + d.to,
              ];
              if (d.channel === 'email' && d.subject) errLines.push('• *Assunto:* ' + d.subject);
              errLines.push('• *Erro:* ' + cleanPushPreview(e.message, 220));
              errLines.push('_Revise ou tente reenviar na Central de Decisões._');
              notifyDecisionWhatsApp(errLines.join('\n'), { panelPath: '/#/inbox' }).catch(() => {});
              throw e;
            } finally {
              draftSending.delete(d.id);
            }
          }

          // ---------- Global Unified Search (chats, tickets, pages, skills, bots, artifacts, memory, Obsidian, ai-memory) ----------
          const OBSIDIAN_DIR = env.OBSIDIAN_DIR || path.join(env.HOME || '/tmp', 'personal-vault');
          function walkMdFiles(rootDir, maxFiles = 300) {
            const out = [];
            if (!rootDir || !fs.existsSync(rootDir)) return out;
            const stack = [rootDir];
            while (stack.length && out.length < maxFiles) {
              const dir = stack.pop();
              let entries;
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { continue; }
              for (const ent of entries) {
                if (out.length >= maxFiles) break;
                if (ent.name.startsWith('.')) continue;
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) stack.push(full);
                else if (ent.isFile() && /\.(md|txt)(?![\s\S])/i.test(ent.name)) out.push(full);
              }
            }
            return out;
          }
          function extractSnippet(text, needle) {
            const s = String(text || '');
            const idx = fold(s).indexOf(needle);
            if (idx < 0) return s.replace(/\s+/g, ' ').slice(0, 140);
            const start = Math.max(0, idx - 50);
            return (start > 0 ? '…' : '') + s.slice(start, start + 160).replace(/\s+/g, ' ') + (start + 160 < s.length ? '…' : '');
          }
          async function globalSearch(rawQ, limit = 30) {
            const q = String(rawQ || '').trim();
            const needle = fold(q);
            if (!needle) return { query: q, total: 0, groups: { chats: [], tickets: [], pages: [], skills: [], bots: [], artifacts: [], memory: [], obsidian: [], semantic: [] } };
            const cap = Math.min(Math.max(Number(limit) || 20, 5), 50);
            const perGroup = Math.max(3, Math.ceil(cap / 3));
            const groups = { chats: [], tickets: [], pages: [], skills: [], bots: [], artifacts: [], memory: [], obsidian: [], semantic: [] };

            // 1. Web chats (title + message content)
            for (const id of Object.keys(chats)) {
              if (isDeleg(id) || isTaskChat(id)) continue;
              const c = chats[id];
              const title = String(c.title || id);
              let matched = fold(title).includes(needle);
              let snippet = '';
              if (isWeb(id)) {
                const msgs = webHistory(id);
                for (let i = msgs.length - 1; i >= 0; i--) {
                  const m = msgs[i];
                  if (m && m.text && fold(m.text).includes(needle)) {
                    matched = true;
                    snippet = extractSnippet(m.text, needle);
                    break;
                  }
                }
              }
              if (matched) {
                groups.chats.push({ id, title, isWeb: isWeb(id), bot: botOf(c).id, snippet: snippet || title, updated: (c.runs && c.runs.at(-1) && c.runs.at(-1).at) || c.created || '' });
                if (groups.chats.length >= perGroup) break;
              }
            }

            // 2. Tickets
            for (const tk of tickets) {
              const hay = tk.title + '\n' + (tk.description || '') + '\n' + (tk.comments || []).map((x) => x.text).join('\n');
              if (fold(hay).includes(needle)) {
                groups.tickets.push({ id: tk.id, title: tk.title, status: tk.status, priority: tk.priority, bot: tk.bot, snippet: extractSnippet(hay, needle) });
                if (groups.tickets.length >= perGroup) break;
              }
            }

            // 3. Pages
            for (const p of Object.values(pages)) {
              const hay = p.id + ' ' + p.title + ' ' + (p.description || '');
              if (fold(hay).includes(needle)) {
                groups.pages.push({ id: p.id, title: p.title, description: p.description || '', public: Boolean(p.public), hasData: Object.keys(readPageData(p.id)).length > 0 });
                if (groups.pages.length >= perGroup) break;
              }
            }

            // 4. Skills
            for (const sk of Object.values(skills)) {
              const hay = sk.slug + ' ' + sk.name + ' ' + (sk.description || '') + ' ' + (sk.instructions || '');
              if (fold(hay).includes(needle)) {
                groups.skills.push({ slug: sk.slug, name: sk.name, description: sk.description || '', snippet: extractSnippet(hay, needle) });
                if (groups.skills.length >= perGroup) break;
              }
            }

            // 5. Bots + Bot memories
            for (const b of Object.values(bots)) {
              const mem = readBotMemory(b.id);
              const hay = b.id + ' ' + b.name + ' ' + (b.description || '') + '\n' + mem;
              if (fold(hay).includes(needle)) {
                groups.bots.push({ id: b.id, name: b.name, emoji: b.emoji, description: b.description || '', snippet: extractSnippet(hay, needle) });
                if (groups.bots.length >= perGroup) break;
              }
            }

            // 6. Artifacts
            for (const a of listArtifacts().items || []) {
              if (fold(a.name + ' ' + (a.chatTitle || '')).includes(needle)) {
                groups.artifacts.push({ name: a.name, kind: a.kind, size: a.size, chatTitle: a.chatTitle || '' });
                if (groups.artifacts.length >= perGroup) break;
              }
            }

            // 7. Local memory files
            for (const m of localMemList()) {
              const hay = (m.file || '') + ' ' + (m.name || '') + ' ' + (m.description || '') + '\n' + (m.body || '');
              if (fold(hay).includes(needle)) {
                groups.memory.push({ file: m.file, title: m.name || m.file, area: m.area || 'memory', snippet: extractSnippet(hay, needle) });
                if (groups.memory.length >= perGroup) break;
              }
            }

            // 8. Obsidian vault
            for (const fp of walkMdFiles(OBSIDIAN_DIR, 250)) {
              const rel = path.relative(OBSIDIAN_DIR, fp);
              let content = '';
              try { content = fs.readFileSync(fp, 'utf8').slice(0, 20000); } catch { continue; }
              if (fold(rel + '\n' + content).includes(needle)) {
                groups.obsidian.push({ path: rel, title: path.basename(rel, path.extname(rel)), snippet: extractSnippet(content || rel, needle) });
                if (groups.obsidian.length >= perGroup) break;
              }
            }

            // 9. Semantic ai-memory (non-blocking, 1.5s budget)
            if (aiMemory.status === 'ok' && q.length >= 3) {
              try {
                const r = await fetch(AI_MEMORY_URL + '/api/v1/workspaces/default/projects/workspace/search?q=' + encodeURIComponent(q) + '&limit=' + perGroup, {
                  headers: aiMemToken() ? { Authorization: 'Bearer ' + aiMemToken() } : {},
                  signal: AbortSignal.timeout(1500),
                });
                if (r.ok) {
                  const j = await r.json();
                  const hits = Array.isArray(j) ? j : (j.results || j.items || []);
                  groups.semantic = hits.slice(0, perGroup).map((h) => ({
                    path: h.path || '', title: h.title || h.path || 'nota', snippet: String(h.snippet || h.summary || h.body || '').replace(/\s+/g, ' ').slice(0, 180),
                  }));
                }
              } catch {}
            }

            const total = Object.values(groups).reduce((acc, arr) => acc + arr.length, 0);
            return { query: q, total, groups };
          }

          // ---------- Action Inbox (unified queue of everything awaiting user decision) ----------
          function actionInbox() {
            const pendingPrompts = [...prompts.values()].filter((p) => p.status === 'pending' && p.kind !== 'nudge').map(promptView);
            const pendingNudges = [...prompts.values()].filter((p) => p.status === 'pending' && p.kind === 'nudge').map(promptView);
            const activeDrafts = drafts.filter((d) => d.status === 'draft' || d.status === 'scheduled' || d.status === 'error').slice().reverse();
            const reviewTickets = tickets.filter((t) => t.status === 'review' || t.status === 'blocked' || t.interrupted).map(ticketView);
            const waitingWorkflows = workflowRuns.filter((r) => r.status === 'waiting_approval').slice(-20).reverse();
            const total = pendingPrompts.length + pendingNudges.length + activeDrafts.length + reviewTickets.length + waitingWorkflows.length;
            return { total, prompts: pendingPrompts, nudges: pendingNudges, drafts: activeDrafts, reviewTickets, waitingWorkflows };
          }

          // ---------- iOS Shortcuts / Share Sheet / Siri Ingest (Bearer token auth) ----------
          function verifyShortcutToken(token) {
            if (!settings.shortcutTokenHash || !token) return false;
            const [salt, want] = String(settings.shortcutTokenHash).split(':');
            if (!salt || !want) return false;
            const got = hashSecurityPin(String(token).trim(), salt).split(':')[1] || '';
            return got.length === want.length && crypto.timingSafeEqual(Buffer.from(got), Buffer.from(want));
          }
          function generateShortcutToken() {
            const raw = 'ac_sc_' + crypto.randomBytes(24).toString('base64url');
            settings.shortcutTokenHash = hashSecurityPin(raw);
            saveSettings();
            audit({ action: 'shortcut-token-rotate', via: 'panel' });
            return { token: raw, endpointUrl: (settings.panelUrl || ('http://127.0.0.1:' + PORT)) + '/api/shortcut' };
          }
          async function handleShortcutIngest(b) {
            const action = String(b.action || 'chat').trim().toLowerCase();
            const text = String(b.text || b.prompt || b.content || '').trim();
            const url = String(b.url || '').trim();
            const title = String(b.title || '').trim();
            const botId = b.bot && bots[b.bot] ? b.bot : '';
            const combined = [title, text, url].filter(Boolean).join('\n');
            if (!combined && !b.file) throw new Error('envie text, url ou file');

            if (action === 'ticket') {
              const tk = createTicket({
                title: (title || text || url).slice(0, 120),
                description: [text, url ? 'URL: ' + url : ''].filter(Boolean).join('\n\n') || 'Capturado via iOS Shortcuts',
                priority: ['low', 'medium', 'high'].includes(b.priority) ? b.priority : 'medium',
                bot: botId || DEFAULT_BOT,
              }, 'shortcut');
              return { ok: true, action, id: tk.id, spoken: 'Tarefa criada no Board: ' + tk.title, ticket: tk };
            }

            if (action === 'note') {
              const inboxDir = path.join(OBSIDIAN_DIR, 'Inbox');
              fs.mkdirSync(inboxDir, { recursive: true });
              const day = new Date().toISOString().slice(0, 10);
              const noteFile = path.join(inboxDir, day + '.md');
              const stamp = new Date().toLocaleTimeString('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
              const entry = '\n- **' + stamp + '**' + (title ? ' — ' + title : '') + (text ? ': ' + text : '') + (url ? ' (' + url + ')' : '') + '\n';
              fs.appendFileSync(noteFile, entry);
              audit({ action: 'shortcut-note', file: path.relative(OBSIDIAN_DIR, noteFile) });
              return { ok: true, action, file: noteFile, spoken: 'Nota salva no Obsidian em Inbox/' + day + '.md.' };
            }

            if (action === 'reminder') {
              const mins = Math.max(1, Math.min(Number(b.inMinutes) || 60, 43200));
              const atIso = b.at ? new Date(b.at).toISOString() : new Date(Date.now() + mins * 60000).toISOString();
              const targetChat = b.chatId || (ALLOWED[0] ? ALLOWED[0] + '@c.us' : Object.keys(chats).find((id) => !isWeb(id) && !isDeleg(id)) || '');
              if (!targetChat) throw new Error('nenhum chat de destino disponível para lembrete');
              const sc = addSchedule({ chatId: targetChat, at: atIso, description: (title || text).slice(0, 80), prompt: 'Lembre ' + (OWNER_NAME || 'o usuário') + ' de forma curta e direta: ' + combined });
              return { ok: true, action, id: sc.id, at: atIso, spoken: 'Lembrete agendado: ' + sc.description };
            }

            if (action === 'draft') {
              const dr = createDraft({ channel: b.channel || 'whatsapp', to: b.to || '', subject: title, body: text || url, bot: botId || DEFAULT_BOT }, 'shortcut');
              return { ok: true, action, id: dr.id, spoken: 'Rascunho salvo para revisão.', draft: dr };
            }

            if (action === 'receipt') {
              const savedFiles = b.file ? saveWebFiles([b.file]) : [];
              const fileNote = savedFiles.length ? ('Arquivo recebido em ' + path.join(INBOX, savedFiles[0].file)) : '';
              const prompt = 'Nota fiscal / comprovante enviado via iPhone Share Sheet. Extraia fornecedor, data, valor, categoria e vencimento (se houver), organize no Google Drive (Documentos/Notas Fiscais/Categoria/Item, yyyy-mm-dd) e crie tarefa se houver pagamento pendente.\n' + [fileNote, combined].filter(Boolean).join('\n');
              const cid = 'web:' + crypto.randomBytes(6).toString('hex');
              const c = chat(cid);
              c.title = 'NF / Comprovante (iPhone)'; c.created = new Date().toISOString(); c.bot = bots.arquivista ? 'arquivista' : DEFAULT_BOT; save();
              webSend(cid, prompt, savedFiles);
              return { ok: true, action, chatId: cid, spoken: 'Comprovante enviado ao Arquivista para extrair e organizar no Drive.' };
            }

            // Default: summarize or chat
            const cid = b.chatId && chats[b.chatId] ? b.chatId : ('web:' + crypto.randomBytes(6).toString('hex'));
            if (!chats[cid]) {
              const c = chat(cid);
              c.title = (title || (action === 'summarize' ? 'Resumo: ' + (url || text) : text)).slice(0, 60);
              c.created = new Date().toISOString();
              if (botId && botId !== DEFAULT_BOT) c.bot = botId;
              save();
            }
            const finalPrompt = action === 'summarize'
              ? 'Resuma em português do Brasil de forma objetiva (máximo 5 bullets) o conteúdo abaixo:\n\n' + combined
              : combined;
            if (b.wait) {
              const r = await runTurn(cid, botId || null, finalPrompt, null, null, null, { noSteer: true });
              const replyText = r.error ? ('Erro: ' + r.error) : (r.text || 'Concluído.');
              webAppend(cid, { role: 'user', text: finalPrompt });
              webAppend(cid, { role: 'assistant', provider: r.provider || providerOf(chat(cid)), bot: botId || botOf(chat(cid)).id, text: replyText, error: Boolean(r.error) });
              return { ok: !r.error, action, chatId: cid, reply: replyText, spoken: speakableText(replyText).slice(0, 600) };
            }
            const savedFiles = b.file ? saveWebFiles([b.file]) : [];
            webSend(cid, finalPrompt, savedFiles);
            return { ok: true, action, chatId: cid, queued: true, spoken: 'Recebido no Agent Control. Estou processando agora.' };
          }

          // ---------- Chat Fork (branch conversation from any message) ----------
          function forkWebChat(srcChatId, b = {}) {
            if (!isWeb(srcChatId) || !chats[srcChatId]) throw new Error('conversa web não encontrada');
            const srcChat = chats[srcChatId];
            const srcMsgs = webHistory(srcChatId);
            let cut = srcMsgs.length;
            if (b.upToMessageId) {
              const idx = srcMsgs.findIndex((m) => m.id === b.upToMessageId);
              if (idx >= 0) cut = idx + 1;
            }
            const copied = srcMsgs.slice(0, cut).map((m) => ({ ...m }));
            const newId = 'web:' + crypto.randomBytes(6).toString('hex');
            const nc = chat(newId);
            nc.title = String(b.title || ('Fork: ' + (srcChat.title || 'Conversa'))).slice(0, 80);
            nc.created = new Date().toISOString();
            nc.forkedFrom = { chatId: srcChatId, messageId: b.upToMessageId || (copied.at(-1) && copied.at(-1).id) || '', count: copied.length };
            nc.forkPendingContext = true;
            if (b.bot && bots[b.bot] && b.bot !== DEFAULT_BOT) nc.bot = b.bot;
            else if (srcChat.bot && b.bot !== DEFAULT_BOT) nc.bot = srcChat.bot;
            if (b.provider && PROVIDERS[b.provider]) nc.provider = b.provider;
            else if (srcChat.provider) nc.provider = srcChat.provider;
            if (b.model) nc.model = String(b.model);
            save();
            try { fs.writeFileSync(webFile(newId), JSON.stringify(copied)); } catch {}
            audit({ action: 'chat-fork', from: srcChatId, to: newId, messages: copied.length });
            return { chat: chatView(newId), messages: copied };
          }

          // ---------- Workspace Git Undo Checkpoints (safe non-destructive stash refs) ----------
          const UNDO_FILE = path.join(DATA_DIR, 'undo-checkpoints.json');
          let undoCheckpoints = loadState('undo_checkpoints', UNDO_FILE, []);
          const saveUndoCheckpoints = () => saveState('undo_checkpoints', UNDO_FILE, undoCheckpoints);
          function resolveUndoRepo(rawRepo) {
            const candidates = [
              rawRepo ? path.resolve(WORKDIR, String(rawRepo)) : '',
              path.join(WORKDIR, 'claude-zap'),
              path.join(WORKDIR, 'agent-control-panel'),
              WORKDIR,
            ].filter(Boolean);
            for (const dir of candidates) {
              if (dir.startsWith(WORKDIR) && fs.existsSync(path.join(dir, '.git'))) return dir;
            }
            throw new Error('repositório git não encontrado em ' + WORKDIR);
          }
          async function createUndoCheckpoint(b = {}) {
            const repo = resolveUndoRepo(b.repo || '');
            const headR = await execCmd('git', ['-C', repo, 'rev-parse', '--short', 'HEAD'], 10000);
            const statR = await execCmd('git', ['-C', repo, 'status', '--porcelain'], 10000);
            const files = statR.out.split('\n').map((l) => l.trim()).filter(Boolean).slice(0, 50);
            const stashR = await execCmd('git', ['-C', repo, 'stash', 'create', String(b.label || 'agent-checkpoint')], 15000);
            const ref = stashR.out.trim() || headR.out.trim();
            if (!ref) throw new Error('não foi possível criar snapshot git');
            const cp = {
              id: crypto.randomBytes(4).toString('hex'),
              repo: path.relative(WORKDIR, repo) || '.',
              repoPath: repo,
              label: String(b.label || 'Checkpoint ' + new Date().toLocaleTimeString('pt-BR', { timeZone: TZ })).slice(0, 120),
              ref,
              head: headR.out.trim(),
              dirty: Boolean(stashR.out.trim()),
              files,
              at: new Date().toISOString(),
            };
            undoCheckpoints.push(cp);
            undoCheckpoints = undoCheckpoints.slice(-30);
            saveUndoCheckpoints();
            audit({ action: 'undo-snapshot', id: cp.id, repo: cp.repo, ref: cp.ref });
            return cp;
          }
          async function restoreUndoCheckpoint(id) {
            const cp = undoCheckpoints.find((x) => x.id === id);
            if (!cp) throw new Error('checkpoint não encontrado');
            if (!fs.existsSync(path.join(cp.repoPath, '.git'))) throw new Error('repositório não existe mais');
            // Safety backup of current state before restoring
            await createUndoCheckpoint({ repo: cp.repo, label: 'Auto-backup antes de restaurar ' + cp.id }).catch(() => {});
            const r = await execCmd('git', ['-C', cp.repoPath, 'checkout', cp.ref, '--', '.'], 20000);
            if (r.code !== 0) throw new Error('falha ao restaurar checkpoint: ' + (r.err || r.out).slice(0, 300));
            audit({ action: 'undo-restore', id: cp.id, repo: cp.repo, ref: cp.ref });
            return { ok: true, restored: cp };
          }

          // ---------- Multi-Step Workflows Engine (chained bots + conditions + approvals + resume) ----------
          const WORKFLOWS_FILE = path.join(DATA_DIR, 'workflows.json');
          const WORKFLOW_RUNS_FILE = path.join(DATA_DIR, 'workflow-runs.json');
          let workflows = loadState('workflows', WORKFLOWS_FILE, {});
          let workflowRuns = loadState('workflow_runs', WORKFLOW_RUNS_FILE, []);
          const saveWorkflows = () => saveState('workflows', WORKFLOWS_FILE, workflows);
          const saveWorkflowRuns = () => saveState('workflow_runs', WORKFLOW_RUNS_FILE, workflowRuns.slice(-100));

          function renderWorkflowTemplate(tpl, ctx) {
            return String(tpl || '').replace(/\{\{([a-zA-Z0-9_.-]+)\}\}/g, (_, key) => {
              const parts = key.split('.');
              let cur = ctx;
              for (const p of parts) {
                if (cur && typeof cur === 'object' && p in cur) cur = cur[p];
                else return '';
              }
              return typeof cur === 'object' ? JSON.stringify(cur) : String(cur ?? '');
            });
          }
          function evalWorkflowCondition(expr, ctx) {
            const rendered = renderWorkflowTemplate(expr, ctx).trim();
            if (!rendered || /^(false|0|nao|não|no|null|undefined|nada_a_relatar)(?![\s\S])/i.test(rendered)) return false;
            const cmp = /^(-?\d+(?:\.\d+)?)\s*(>=|<=|>|<|==|!=)\s*(-?\d+(?:\.\d+)?)(?![\s\S])/.exec(rendered);
            if (cmp) {
              const a = Number(cmp[1]), op = cmp[2], b = Number(cmp[3]);
              if (op === '>') return a > b;
              if (op === '>=') return a >= b;
              if (op === '<') return a < b;
              if (op === '<=') return a <= b;
              if (op === '==') return a === b;
              if (op === '!=') return a !== b;
            }
            const cont = /^(.+?)\s+(contains|!contains|==|!=)\s+(.+)(?![\s\S])/i.exec(rendered);
            if (cont) {
              const lhs = fold(cont[1]), op = cont[2].toLowerCase(), rhs = fold(cont[3]);
              if (op === 'contains') return lhs.includes(rhs);
              if (op === '!contains') return !lhs.includes(rhs);
              if (op === '==') return lhs === rhs;
              if (op === '!=') return lhs !== rhs;
            }
            return true;
          }
          function createWorkflow(b, via = 'panel') {
            const name = String(b.name || '').trim().slice(0, 120);
            if (!name) throw new Error('nome do workflow obrigatório');
            const steps = Array.isArray(b.steps) ? b.steps.slice(0, 20).map((s, idx) => ({
              id: String(s.id || ('step_' + (idx + 1))).replace(/[^a-zA-Z0-9_-]/g, ''),
              name: String(s.name || ('Etapa ' + (idx + 1))).slice(0, 100),
              type: ['bot', 'condition', 'approval', 'page_data', 'notify', 'draft'].includes(s.type) ? s.type : 'bot',
              bot: s.bot && bots[s.bot] ? s.bot : DEFAULT_BOT,
              prompt: String(s.prompt || '').slice(0, 8000),
              expr: String(s.expr || '').slice(0, 500),
              title: String(s.title || '').slice(0, 120),
              question: String(s.question || '').slice(0, 1000),
              options: Array.isArray(s.options) ? s.options.slice(0, 6) : ['Aprovar', 'Cancelar'],
              pageId: String(s.pageId || '').slice(0, 80),
              patch: s.patch && typeof s.patch === 'object' ? s.patch : null,
              to: String(s.to || '').slice(0, 200),
              channel: String(s.channel || 'whatsapp').slice(0, 20),
              subject: String(s.subject || '').slice(0, 200),
              chatId: String(s.chatId || '').slice(0, 100),
            })) : [];
            if (!steps.length) throw new Error('o workflow precisa de pelo menos 1 etapa');
            const id = b.id ? pageSlug(b.id) : ('wf-' + crypto.randomBytes(3).toString('hex'));
            const now = new Date().toISOString();
            const trigger = b.trigger && typeof b.trigger === 'object' ? {
              cron: b.trigger.cron && validCron(b.trigger.cron) ? String(b.trigger.cron).trim() : '',
              webhook: Boolean(b.trigger.webhook),
              ...(b.trigger.webhook ? { hookToken: crypto.randomBytes(12).toString('hex') } : {}),
            } : {};
            const wf = {
              id, name, description: String(b.description || '').trim().slice(0, 300),
              enabled: b.enabled !== false,
              chatId: String(b.chatId || ''),
              trigger,
              steps,
              created: now, updated: now,
            };
            workflows[id] = wf;
            saveWorkflows();
            audit({ action: 'workflow-create', id, name, steps: steps.length, via });
            return wf;
          }
          function patchWorkflow(id, b, via = 'panel') {
            const wf = workflows[id];
            if (!wf) throw new Error('workflow não encontrado');
            if ('name' in b && String(b.name || '').trim()) wf.name = String(b.name).trim().slice(0, 120);
            if ('description' in b) wf.description = String(b.description || '').trim().slice(0, 300);
            if ('enabled' in b) wf.enabled = Boolean(b.enabled);
            if ('chatId' in b) wf.chatId = String(b.chatId || '');
            if ('trigger' in b && b.trigger && typeof b.trigger === 'object') {
              const tr = Object.assign({}, wf.trigger || {});
              if ('cron' in b.trigger) {
                if (b.trigger.cron && !validCron(b.trigger.cron)) throw new Error('cron inválido');
                tr.cron = b.trigger.cron ? String(b.trigger.cron).trim() : '';
              }
              if ('webhook' in b.trigger) {
                tr.webhook = Boolean(b.trigger.webhook);
                if (tr.webhook && !tr.hookToken) tr.hookToken = crypto.randomBytes(12).toString('hex');
              }
              wf.trigger = tr;
            }
            if (Array.isArray(b.steps) && b.steps.length) {
              const tmp = createWorkflow({ ...wf, steps: b.steps, id: '__tmp__' }, via);
              delete workflows.__tmp__;
              wf.steps = tmp.steps;
            }
            wf.updated = new Date().toISOString();
            saveWorkflows();
            audit({ action: 'workflow-update', id, via });
            return wf;
          }
          function deleteWorkflow(id, via = 'panel') {
            if (!workflows[id]) throw new Error('workflow não encontrado');
            delete workflows[id];
            saveWorkflows();
            audit({ action: 'workflow-delete', id, via });
            return { deleted: id };
          }
          async function executeWorkflowFrom(run, startIdx) {
            const wf = workflows[run.workflowId];
            if (!wf) { run.status = 'error'; run.error = 'workflow removido'; run.doneAt = new Date().toISOString(); saveWorkflowRuns(); return run; }
            run.status = 'running';
            delete run.error;
            saveWorkflowRuns();
            for (let i = startIdx; i < wf.steps.length; i++) {
              run.currentStep = i;
              const step = wf.steps[i];
              const t0 = Date.now();
              const rec = { stepId: step.id, name: step.name, type: step.type, status: 'running', at: new Date().toISOString(), output: '', ms: 0, cost: 0 };
              run.stepLogs.push(rec);
              saveWorkflowRuns();
              try {
                if (step.type === 'bot') {
                  const promptText = renderWorkflowTemplate(step.prompt, run.context);
                  const cid = 'wf:' + run.id + ':' + step.id;
                  const r = await runAgent(cid, promptText, { bot: step.bot, noSteer: true });
                  rec.ms = (r.usage && r.usage.ms) || (Date.now() - t0);
                  rec.cost = (r.usage && r.usage.cost) || 0;
                  if (r.error) throw new Error(r.error);
                  rec.output = String(r.text || '').slice(0, 6000);
                  rec.status = 'ok';
                  run.context.steps[step.id] = rec.output;
                  run.context.last = rec.output;
                } else if (step.type === 'condition') {
                  const pass = evalWorkflowCondition(step.expr, run.context);
                  rec.output = pass ? 'true (continua)' : 'false (encerra fluxo)';
                  rec.status = pass ? 'ok' : 'stopped';
                  rec.ms = Date.now() - t0;
                  run.context.steps[step.id] = pass ? 'true' : 'false';
                  if (!pass) {
                    run.status = 'done';
                    run.doneAt = new Date().toISOString();
                    saveWorkflowRuns();
                    return run;
                  }
                } else if (step.type === 'approval') {
                  const targetChat = step.chatId || wf.chatId || Object.keys(chats).find((id) => isWeb(id)) || Object.keys(chats).find((id) => isWhatsApp(id) && !id.endsWith('@g.us')) || (ALLOWED[0] ? ALLOWED[0] + '@c.us' : '');
                  if (!targetChat || !chats[targetChat]) throw new Error('nenhum chat válido para enviar cartão de aprovação');
                  const p = startPrompt({
                    chatId: targetChat,
                    title: renderWorkflowTemplate(step.title || ('Aprovação: ' + wf.name), run.context),
                    question: renderWorkflowTemplate(step.question || 'Aprovar próxima etapa do workflow?', run.context),
                    options: step.options && step.options.length ? step.options : ['Aprovar', 'Cancelar'],
                    bot: step.bot || DEFAULT_BOT,
                  });
                  p.workflowRunId = run.id;
                  p.workflowStepIdx = i;
                  rec.status = 'waiting_approval';
                  rec.promptId = p.id;
                  rec.output = 'Aguardando aprovação (cartão #' + p.id + ')';
                  rec.ms = Date.now() - t0;
                  run.status = 'waiting_approval';
                  run.pendingPromptId = p.id;
                  saveWorkflowRuns();
                  return run;
                } else if (step.type === 'page_data') {
                  if (!step.pageId || !pages[step.pageId]) throw new Error('página não encontrada: ' + step.pageId);
                  const patchObj = {};
                  for (const [k, v] of Object.entries(step.patch || { lastOutput: '{{last}}' })) {
                    patchObj[k] = typeof v === 'string' ? renderWorkflowTemplate(v, run.context) : v;
                  }
                  patchObj._updatedAt = new Date().toISOString();
                  patchPageData(step.pageId, patchObj);
                  rec.output = 'Atualizou página ' + step.pageId;
                  rec.status = 'ok';
                  rec.ms = Date.now() - t0;
                } else if (step.type === 'draft') {
                  const bodyText = renderWorkflowTemplate(step.prompt || '{{last}}', run.context);
                  const dr = createDraft({
                    channel: step.channel || 'whatsapp',
                    to: renderWorkflowTemplate(step.to, run.context),
                    subject: renderWorkflowTemplate(step.subject || wf.name, run.context),
                    body: bodyText,
                    bot: step.bot || DEFAULT_BOT,
                    chatId: wf.chatId || '',
                  }, 'workflow');
                  rec.output = 'Rascunho #' + dr.id + ' criado';
                  rec.status = 'ok';
                  rec.ms = Date.now() - t0;
                } else if (step.type === 'notify') {
                  const msgText = renderWorkflowTemplate(step.prompt || '{{last}}', run.context);
                  const targetChat = step.chatId || wf.chatId || (ALLOWED[0] ? ALLOWED[0] + '@c.us' : '');
                  if (targetChat && chats[targetChat]) await reply(targetChat, msgText, false);
                  else if (step.to) await sendMessage({ to: step.to, text: msgText });
                  rec.output = 'Notificação enviada (' + msgText.length + ' chars)';
                  rec.status = 'ok';
                  rec.ms = Date.now() - t0;
                }
                saveWorkflowRuns();
              } catch (e) {
                rec.status = 'error';
                rec.error = e.message;
                rec.ms = Date.now() - t0;
                run.status = 'error';
                run.error = 'Etapa "' + step.name + '": ' + e.message;
                run.doneAt = new Date().toISOString();
                saveWorkflowRuns();
                audit({ action: 'workflow-error', workflowId: wf.id, runId: run.id, step: step.id, error: e.message });
                return run;
              }
            }
            run.status = 'done';
            run.doneAt = new Date().toISOString();
            saveWorkflowRuns();
            audit({ action: 'workflow-done', workflowId: wf.id, runId: run.id, steps: run.stepLogs.length });
            return run;
          }
          async function startWorkflowRun(workflowId, triggerData = {}) {
            const wf = workflows[workflowId];
            if (!wf) throw new Error('workflow não encontrado');
            const run = {
              id: crypto.randomBytes(4).toString('hex'),
              workflowId: wf.id,
              workflowName: wf.name,
              status: 'running',
              currentStep: 0,
              context: { trigger: typeof triggerData === 'string' ? triggerData : JSON.stringify(triggerData), steps: {}, last: '' },
              stepLogs: [],
              started: new Date().toISOString(),
            };
            workflowRuns.push(run);
            workflowRuns = workflowRuns.slice(-100);
            saveWorkflowRuns();
            return executeWorkflowFrom(run, 0);
          }
          async function resumeWorkflowRun(runId, fromStep = null) {
            const run = workflowRuns.find((r) => r.id === runId);
            if (!run) throw new Error('execução de workflow não encontrada');
            const idx = fromStep !== null && fromStep !== undefined ? Math.max(0, Number(fromStep)) : (run.currentStep || 0);
            delete run.pendingPromptId;
            return executeWorkflowFrom(run, idx);
          }
          async function resumeWorkflowFromPrompt(p) {
            const run = workflowRuns.find((r) => r.id === p.workflowRunId);
            if (!run || run.status !== 'waiting_approval') return;
            const fAns = fold(p.answer || '');
            const approved = !(fAns.startsWith('cancel') || fAns.startsWith('recus') || fAns.startsWith('nao') || fAns.startsWith('não'));
            const logEntry = run.stepLogs.find((x) => x.promptId === p.id);
            if (logEntry) {
              logEntry.status = approved ? 'ok' : 'rejected';
              logEntry.output = 'Resposta: ' + (p.answer || '') + (p.note ? ' (' + p.note + ')' : '');
            }
            delete run.pendingPromptId;
            run.context.steps[(logEntry && logEntry.stepId) || 'approval'] = p.answer || '';
            if (!approved) {
              run.status = 'done';
              run.doneAt = new Date().toISOString();
              saveWorkflowRuns();
              return;
            }
            await executeWorkflowFrom(run, (p.workflowStepIdx || 0) + 1);
          }

          // Morning Briefing 1-click preset (creates live Page + daily 07:30 schedule with optional WhatsApp voice note)
          function createMorningBriefingPreset(b = {}) {
            const chatId = String(b.chatId || (ALLOWED[0] ? ALLOWED[0] + '@c.us' : '') || Object.keys(chats).find((id) => isWeb(id)) || '');
            const cron = String(b.cron || '30 7 * * *').trim();
            const withAudio = Boolean(b.withAudio);
            const pageHtml = '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
              '<title>Briefing Diário</title><style>body{font-family:-apple-system,system-ui,sans-serif;background:#0b0d12;color:#f3f4f6;margin:0;padding:20px;line-height:1.5}' +
              '.wrap{max-width:780px;margin:0 auto}.card{background:#161a24;border:1px solid #262c3d;border-radius:16px;padding:16px 18px;margin-bottom:14px}' +
              'h1{margin:0 0 6px;font-size:24px}.muted{color:#9ca3af;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}' +
              '.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:#1f2937;font-size:12px;margin-right:6px}</style></head><body>' +
              '<div class="wrap"><h1>☀️ Briefing Diário</h1><div class="muted" id="meta">Carregando dados…</div>' +
              '<div id="summary" class="card" style="margin-top:14px">Aguardando primeira geração do briefing.</div>' +
              '<div class="grid" id="sections"></div></div>' +
              '<script>window.PageData&&window.PageData.get().then(function(d){' +
              'if(!d||!d.date){return;}' +
              'document.getElementById("meta").textContent="Atualizado em "+d.date+(d.weather?" · "+d.weather:"");' +
              'document.getElementById("summary").innerHTML="<strong>Resumo do Dia</strong><p>"+(d.summary||"")+"</p>";' +
              'var sec=document.getElementById("sections");sec.innerHTML="";' +
              '(d.cards||[]).forEach(function(c){var el=document.createElement("div");el.className="card";el.innerHTML="<strong>"+(c.title||"")+"</strong><p style=white-space:pre-line>"+(c.body||"")+"</p>";sec.appendChild(el);});' +
              '});</script></body></html>';
            const page = createPage({
              id: 'briefing-diario', upsert: true, title: '☀️ Briefing Diário',
              description: 'Painel vivo atualizado toda manhã com agenda, tickets, saúde da infra e destaques do Radar.',
              html: pageHtml, bot: DEFAULT_BOT, chatId, public: false,
            }, 'preset');
            const existing = schedules.find((s) => s.description && s.description.includes('Briefing Diário'));
            const prompt = 'Monte o Briefing Diário' + (OWNER_NAME ? ' de ' + OWNER_NAME : '') + ' (curto, direto e útil):\n' +
              '1. Liste tickets abertos/em review em http://127.0.0.1:' + PORT + '/tickets e rascunhos/pendências em http://127.0.0.1:' + PORT + '/drafts.\n' +
              '2. Verifique saúde rápida do servidor (GET http://127.0.0.1:' + PORT + '/health ou ~/bin/health-watchdog --verbose se existir) e e-mails recentes importantes.\n' +
              '3. Se relevante, inclua 2-3 destaques rápidos de IA/tech.\n' +
              '4. Atualize a Página Viva do briefing via PUT http://127.0.0.1:' + PORT + '/pages/briefing-diario/data com JSON {"date":"<hoje>","summary":"...","cards":[{"title":"Tarefas","body":"..."},{"title":"Infra & E-mails","body":"..."},{"title":"Radar","body":"..."}]}.\n' +
              (withAudio ? '5. Gere um resumo falado de ~1 minuto e envie como nota de voz no WhatsApp (via POST http://127.0.0.1:' + PORT + '/send-voice ou ~/bin/falar + ~/bin/enviar-voz se configurados).\n' : '') +
              '6. Responda com um resumo enxuto (sem tabelas se for WhatsApp).';
            const sched = existing || addSchedule({ chatId: chatId || 'web:briefing', cron, bot: DEFAULT_BOT, description: '☀️ Briefing Diário (Página Viva' + (withAudio ? ' + Áudio' : '') + ')', prompt });
            return { page, schedule: sched };
          }

          // ---------- 1-Click Behavior Correction / Provenance Feedback ----------
          function applyBehaviorCorrection(b = {}) {
            const botId = b.botId && bots[b.botId] ? b.botId : DEFAULT_BOT;
            const correction = String(b.correction || '').trim().slice(0, 1000);
            if (!correction) throw new Error('descreva a correção desejada');
            const stamp = new Date().toISOString().slice(0, 10);
            const line = '- [' + stamp + '] REGRA DO USUÁRIO: ' + correction;
            if (botId === DEFAULT_BOT && fs.existsSync(MEMORY_DIR)) {
              const f = path.join(MEMORY_DIR, 'regras-corrigidas.md');
              const header = fs.existsSync(f) ? '' : '---\nname: regras-corrigidas\ndescription: Regras aprendidas por correção direta no chat\n---\n\n';
              fs.appendFileSync(f, header + line + '\n');
            } else {
              const cur = readBotMemory(botId).trim();
              writeBotMemory(botId, (cur ? cur + '\n' : '# Memória — Bot ' + bots[botId].name + '\n') + line + '\n');
            }
            if (b.chatId && b.messageId && isWeb(b.chatId)) {
              webUpdate(b.chatId, b.messageId, { corrected: true, correctionNote: correction });
            }
            audit({ action: 'behavior-correct', bot: botId, chatId: b.chatId || '', correction: correction.slice(0, 120) });
            return { ok: true, bot: botId, savedRule: line };
          }

          // ---------- artifacts index & unified activity feed ----------
          const ARTIFACTS_DIR = path.join(WORKDIR, 'artifacts');
          function listArtifacts() {
            const fileMeta = new Map(); // filename -> { chatId, chatTitle, bot }
            for (const id of Object.keys(chats)) {
              if (!isWeb(id)) continue;
              const h = webHistory(id);
              const title = chatView(id).title;
              const bot = botOf(chats[id]).id;
              for (const m of h) {
                for (const f of m.files || []) {
                  if (f.file) fileMeta.set(f.file, { chatId: id, chatTitle: title, bot: m.bot || bot, origName: f.name, type: f.type, voice: Boolean(f.voice) });
                }
                if (m.tts) fileMeta.set(m.tts, { chatId: id, chatTitle: title, bot: m.bot || bot, origName: m.tts, type: 'audio/mp4', voice: true });
              }
            }
            const items = [];
            const scan = (dir, source) => {
              let list = [];
              try { list = fs.readdirSync(dir); } catch { return; }
              for (const name of list) {
                if (name.startsWith('.')) continue;
                const full = path.join(dir, name);
                let st; try { st = fs.statSync(full); } catch { continue; }
                if (!st.isFile()) continue;
                const ext = path.extname(name).toLowerCase();
                const meta = fileMeta.get(name) || {};
                items.push({
                  name, source, origName: meta.origName || name, size: st.size, ext,
                  type: meta.type || (ext === '.png' ? 'image/png' : ext === '.jpg' || ext === '.jpeg' ? 'image/jpeg' : ext === '.webp' ? 'image/webp' : ext === '.pdf' ? 'application/pdf' : ext === '.m4a' || ext === '.mp4' ? 'audio/mp4' : ext === '.ogg' ? 'audio/ogg' : 'application/octet-stream'),
                  voice: Boolean(meta.voice),
                  chatId: meta.chatId || '', chatTitle: meta.chatTitle || '', bot: meta.bot || '',
                  created: st.mtime.toISOString(),
                });
              }
            };
            scan(INBOX, 'inbox');
            if (fs.existsSync(ARTIFACTS_DIR)) scan(ARTIFACTS_DIR, 'artifacts');
            const sorted = items.sort((a, b) => b.created.localeCompare(a.created));
            return sorted.slice(0, 300);
          }
          function artifactKind(a) {
            if (a.type && a.type.startsWith('image/')) return 'image';
            if ((a.type && a.type.startsWith('audio/')) || a.voice) return 'audio';
            return 'doc';
          }
          function deleteArtifactsBulk({ names = null, kind = '' } = {}) {
            const allowedKinds = new Set(['image', 'audio', 'doc']);
            const filterKind = allowedKinds.has(kind) ? kind : '';
            const nameSet = Array.isArray(names) && names.length ? new Set(names.map((n) => path.basename(String(n || ''))).filter(Boolean)) : null;
            const all = listArtifacts();
            let deleted = 0, freedBytes = 0;
            for (const item of all) {
              if (filterKind && artifactKind(item) !== filterKind) continue;
              if (nameSet && !nameSet.has(item.name)) continue;
              const fp = artifactPath(item.name);
              if (!fp) continue;
              try {
                const st = fs.statSync(fp);
                fs.unlinkSync(fp);
                deleted += 1;
                freedBytes += st.size || 0;
              } catch {}
            }
            audit({ action: 'artifacts-bulk-delete', deleted, freedBytes, kind: filterKind || 'all', via: 'panel' });
            return { deleted, freedBytes };
          }
          function artifactPath(name) {
            const base = path.basename(String(name || ''));
            if (!base || base.startsWith('.')) return '';
            for (const dir of [INBOX, ARTIFACTS_DIR]) {
              const p = path.join(dir, base);
              if (fs.existsSync(p) && fs.statSync(p).isFile()) return p;
            }
            return '';
          }
          function activityFeed() {
            const items = [];
            for (const [id, r] of running.entries()) {
              const cv = chatView(id);
              items.push({ kind: 'running', id: 'run-' + id, chatId: id, title: cv.title, bot: r.bot || cv.bot, text: r.prompt, at: new Date(r.started).toISOString(), status: 'running' });
            }
            for (const p of prompts.values()) {
              if (p.status === 'pending') {
                items.push({ kind: p.kind === 'secret' ? 'secret' : 'prompt', id: 'prp-' + p.id, chatId: p.chatId, title: p.title, bot: p.bot, text: p.question, at: p.created, status: 'pending' });
              }
            }
            if (computer.needsHuman.active) {
              items.push({ kind: 'computer', id: 'comp-nh', chatId: computer.needsHuman.chatId, title: 'Computador precisa de você', bot: '', text: computer.needsHuman.reason, at: computer.needsHuman.at, status: 'pending' });
            }
            for (const t of tickets) {
              if (t.status === 'in_progress' || t.status === 'review' || t.status === 'blocked') {
                items.push({ kind: 'ticket', id: 'tkt-' + t.id, ticketId: t.id, title: (t.goal ? '🎯 ' : '') + 'Tarefa #' + t.id + ' · ' + t.title, bot: t.bot, text: t.status, at: t.updated, status: t.status });
              }
            }
            for (const tk of taskSessions.slice(-20)) {
              items.push({ kind: 'task', id: 'tsk-' + tk.id, chatId: tk.parentChatId, title: '🧵 ' + tk.title, bot: tk.bot, text: (tk.error || tk.result || tk.status).slice(0, 140), at: tk.doneAt || tk.created, status: tk.status, ms: tk.ms || 0 });
            }
            for (const [sid, list] of Object.entries(routineRuns)) {
              const s = schedules.find((x) => x.id === sid);
              for (const rr of (list || []).slice(-3)) {
                items.push({ kind: 'routine', id: 'rr-' + rr.id, chatId: s ? s.chatId : '', title: (s ? s.description : 'Rotina #' + sid), bot: s ? (s.bot || '') : '', text: (rr.text || '').slice(0, 140), at: rr.at, status: rr.status, ms: rr.ms || 0 });
              }
            }
            for (const id of Object.keys(chats)) {
              if (!isWeb(id)) continue;
              const c = chats[id];
              const last = (c.runs || []).at(-1);
              if (last) items.push({ kind: 'chat', id: 'ch-' + id + '-' + last.at, chatId: id, title: c.title || 'Conversa', bot: botOf(c).id, text: last.prompt || '', at: last.at, status: last.error ? 'error' : 'ok', ms: last.ms || 0 });
            }
            return items.sort((a, b) => String(b.at || '').localeCompare(String(a.at || ''))).slice(0, 80);
          }

          // ---------- send to any number (local only, used by Claude itself) ----------
          // "to" may be a phone number in any format (+55 11 9...), or a full WhatsApp id (...@c.us / ...@g.us / ...@lid).
          async function resolveTo(to) {
            to = String(to || '').trim();
            if (to.includes('@')) return to;
            const digits = to.replace(/\D/g, '');
            if (digits.length < 10) throw new Error('número inválido (use DDI+DDD+número, ex. 5511999998888)');
            try {
              const r = await waha('GET', '/api/contacts/check-exists?session=' + encodeURIComponent(activeWaha().session) + '&phone=' + digits);
              if (r && r.numberExists === false) throw new Error('o número ' + digits + ' não tem WhatsApp');
              if (r && r.chatId) return r.chatId;
            } catch (e) {
              if (e.message.includes('não tem WhatsApp')) throw e;
              log('check-exists failed, using raw number', e.message);
            }
            return digits + '@c.us';
          }

          async function sendMessage(reqBody) {
            const { to, text } = reqBody;
            if (reqBody.chatId && readOnlyRuns.has(String(reqBody.chatId))) throw new Error('bloqueado pelo modo proativo somente leitura (read-only)');
            if (!text || !String(text).trim()) throw new Error('texto vazio');
            const chatId = await resolveTo(to);
            await assertWhatsAppRecipientAllowed(chatId);
            const sess = activeWaha().session;
            for (const part of chunks(reqBody.raw ? String(text) : toWhatsApp(String(text)))) {
              await waha('POST', '/api/sendText', { session: sess, chatId, text: part });
            }
            log('sent message to', chatId);
            audit({ action: 'send', to: chatId, chars: String(text).length, preview: String(text).slice(0, 80) });
            return { sent: true, chatId };
          }

          // ---------- send-file (local only, used by Claude itself) ----------
          async function sendFile(reqBody) {
            const { path: p, caption } = reqBody;
            if (reqBody.chatId && readOnlyRuns.has(String(reqBody.chatId))) throw new Error('bloqueado pelo modo proativo somente leitura (read-only)');
            let chatId = reqBody.chatId;
            if (reqBody.to) chatId = await resolveTo(reqBody.to);
            else if (!chatId || !chats[chatId]) throw new Error('chatId desconhecido');
            await assertWhatsAppRecipientAllowed(chatId);
            const abs = path.resolve(WORKDIR, p);
            const data = fs.readFileSync(abs).toString('base64');
            const ext = path.extname(abs).toLowerCase();
            const types = { '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.gif': 'image/gif', '.webp': 'image/webp',
              '.pdf': 'application/pdf', '.txt': 'text/plain', '.csv': 'text/csv', '.json': 'application/json', '.zip': 'application/zip',
              '.mp3': 'audio/mpeg', '.ogg': 'audio/ogg', '.mp4': 'video/mp4', '.xlsx': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
              '.docx': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' };
            const mimetype = types[ext] || 'application/octet-stream';
            const file = { mimetype, filename: path.basename(abs), data };
            const endpoint = mimetype.startsWith('image/') ? '/api/sendImage' : '/api/sendFile';
            const result = await waha('POST', endpoint, { session: activeWaha().session, chatId, file, caption: caption || undefined });
            audit({ action: 'send-file', to: chatId, file: abs, bytes: fs.statSync(abs).size, caption: caption || null });
            return result;
          }

          async function sendVoice(reqBody) {
            const { to, path: p, text } = reqBody || {};
            if (reqBody && reqBody.chatId && readOnlyRuns.has(String(reqBody.chatId))) throw new Error('bloqueado pelo modo proativo somente leitura (read-only)');
            let chatId = reqBody && reqBody.chatId;
            if (to) chatId = await resolveTo(to);
            else if (!chatId || !chats[chatId]) throw new Error('chatId ou to obrigatório');
            await assertWhatsAppRecipientAllowed(chatId);
            let oggPath = '';
            let cleanup = false;
            let engine = '';
            try {
              if (p) {
                const abs = path.resolve(WORKDIR, p);
                if (!fs.existsSync(abs)) throw new Error('arquivo não encontrado: ' + abs);
                if (path.extname(abs).toLowerCase() === '.ogg') {
                  oggPath = abs;
                  engine = 'arquivo';
                } else {
                  if (!binExists('ffmpeg')) throw new Error('ffmpeg não encontrado para converter áudio em .ogg');
                  oggPath = path.join(INBOX, 'voice-tmp-' + crypto.randomBytes(4).toString('hex') + '.ogg');
                  cleanup = true;
                  const conv = await execCmd('ffmpeg', ['-y', '-loglevel', 'error', '-i', abs, '-ac', '1', '-ar', '24000', '-c:a', 'libopus', '-b:a', '40k', oggPath], 120000);
                  if (conv.code !== 0 || !fs.existsSync(oggPath)) throw new Error('conversão para opus falhou: ' + (conv.err || '').slice(0, 200));
                  engine = 'ffmpeg';
                }
              } else if (text && String(text).trim()) {
                oggPath = path.join(INBOX, 'voice-tmp-' + crypto.randomBytes(4).toString('hex') + '.ogg');
                cleanup = true;
                const tts = await synthesizeSpeech(String(text).trim(), oggPath);
                engine = tts.engine;
              } else {
                throw new Error('informe "text" ou "path"');
              }
              const data = fs.readFileSync(oggPath).toString('base64');
              await waha('POST', '/api/sendVoice', { session: activeWaha().session, chatId, file: { mimetype: 'audio/ogg; codecs=opus', filename: 'voz.ogg', data }, convert: false });
              audit({ action: 'send-voice', to: chatId, engine });
              return { sent: true, chatId, engine };
            } finally {
              if (cleanup && oggPath) { try { fs.unlinkSync(oggPath); } catch {} }
            }
          }

          // ---------- web chat (conversations started from the Agent Control panel) ----------
          const WEB_DIR = path.join(DATA_DIR, 'web');
          fs.mkdirSync(WEB_DIR, { recursive: true });
          const webFile = (chatId) => path.join(WEB_DIR, String(chatId).slice(4).replace(/[^a-f0-9]/g, '') + '.json');
          const webListeners = new Map(); // chatId -> Set(fn(event))
          const webGlobalListeners = new Set(); // Set(fn(event)) for app-wide web notifications
          function cleanPushPreview(text, max = 180) {
            let s = String(text || '');
            if (!s) return '';
            s = s.replace(/```suggestions[\s\S]*?```/gi, ' ');
            s = s.replace(/<suggestions>[\s\S]*?<\/suggestions>/gi, ' ');
            s = s.replace(/```[a-z0-9_-]*\s*/gi, ' ').replace(/```/g, ' ');
            s = s.replace(/!\[([^\]]*)\]\([^)]*\)/g, (_, alt) => (alt ? alt + ' ' : ' '));
            s = s.replace(/\[([^\]]+)\]\([^)]*\)/g, (_, label) => label);
            s = s.replace(/`([^`]+)`/g, (_, code) => code);
            s = s.replace(/^\s*#{1,6}\s+/gm, '');
            s = s.replace(/^\s*>\s?/gm, '');
            s = s.replace(/(\*\*|__|~~)/g, '');
            s = s.replace(/[`*_~#]/g, '');
            s = s.replace(/\s+/g, ' ').trim();
            if (max > 1 && s.length > max) return s.slice(0, max - 1).trimEnd() + '…';
            return s.slice(0, max);
          }
          function webHistory(chatId) {
            try { return JSON.parse(fs.readFileSync(webFile(chatId), 'utf8')); } catch { return []; }
          }
          function webEmit(chatId, ev) {
            for (const fn of webListeners.get(chatId) || []) { try { fn(ev); } catch {} }
          }
          function webGlobalEmit(ev) {
            for (const fn of webGlobalListeners) { try { fn(ev); } catch {} }
          }
          function webAppend(chatId, msg) {
            const { noPush, ...cleanMsg } = msg || {};
            const m = { id: crypto.randomBytes(4).toString('hex'), at: new Date().toISOString(), ...cleanMsg };
            const h = webHistory(chatId);
            h.push(m);
            fs.writeFileSync(webFile(chatId), JSON.stringify(h.slice(-500)));
            webEmit(chatId, { type: 'message', message: m });
            if (isWeb(chatId) && m.role === 'assistant') {
              const c = chats[chatId];
              const rawTitle = (c && c.title) || '';
              const chatTitle = rawTitle || 'Conversa web';
              const bObj = (m.bot && bots[m.bot]) || (c ? botOf(c) : bots[DEFAULT_BOT]);
              const botName = bObj ? botLabel(bObj) : (m.bot || '');
              const url = '/#/chat/' + String(chatId).slice(4);
              if (!noPush) {
                webGlobalEmit({
                  type: 'message',
                  chatId,
                  chatTitle,
                  botName,
                  message: {
                    id: m.id,
                    role: m.role,
                    text: cleanPushPreview(m.text, 220),
                    bot: m.bot || '',
                    error: Boolean(m.error),
                    stopped: Boolean(m.stopped),
                    at: m.at,
                  },
                  tag: 'msg-' + m.id,
                  url,
                });
              }
              if (!m.stopped && !noPush) {
                notifyPush({
                  title: rawTitle || botName || 'Agent Control',
                  body: cleanPushPreview(m.text, 180) || 'Nova resposta',
                  chatId,
                  tag: 'msg-' + m.id,
                  url,
                });
              }
            }
            return m;
          }
          function webUpdate(chatId, msgId, patch) {
            const h = webHistory(chatId);
            const m = h.find((x) => x.id === msgId);
            if (!m) return null;
            Object.assign(m, patch);
            fs.writeFileSync(webFile(chatId), JSON.stringify(h));
            webEmit(chatId, { type: 'update', id: msgId, patch });
            return m;
          }
          const HOME_BIN = (n) => path.join(env.HOME || '/tmp', 'bin', n);
          // Voice notes from the panel are transcribed by the bridge (~/bin/transcrever: Groq, local Whisper as fallback),
          // shown under the voice note and handed to the agent, so it doesn't transcribe again.
          async function transcribeFile(file) {
            if (fs.existsSync(HOME_BIN('transcrever'))) {
              const r = await execCmd(HOME_BIN('transcrever'), [file], 180000);
              const mt = /^\[([^\]]+)\]\s*([\s\S]*)(?![\s\S])/.exec((r.out || '').trim());
              return r.code === 0 && mt && mt[2].trim() ? { engine: mt[1].trim(), text: mt[2].trim() } : null;
            }
            const groqKey = env.GROQ_API_KEY || (secrets.groq_api_key && secrets.groq_api_key.value) || '';
            if (groqKey) {
              try {
                const fd = new FormData();
                fd.append('file', new Blob([fs.readFileSync(file)]), path.basename(file));
                fd.append('model', env.STT_MODEL || 'whisper-large-v3-turbo');
                fd.append('language', env.STT_LANGUAGE || 'pt');
                fd.append('response_format', 'text');
                const r = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                  method: 'POST', headers: { Authorization: 'Bearer ' + groqKey }, body: fd, signal: AbortSignal.timeout(45000),
                });
                const txt = (await r.text()).trim();
                if (r.ok && txt) return { engine: 'Groq Whisper', text: txt };
              } catch {}
            }
            const openaiKey = env.OPENAI_API_KEY || (secrets.openai_api_key && secrets.openai_api_key.value) || '';
            if (openaiKey) {
              try {
                const fd = new FormData();
                fd.append('file', new Blob([fs.readFileSync(file)]), path.basename(file));
                fd.append('model', 'whisper-1');
                fd.append('language', env.STT_LANGUAGE || 'pt');
                fd.append('response_format', 'text');
                const r = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                  method: 'POST', headers: { Authorization: 'Bearer ' + openaiKey }, body: fd, signal: AbortSignal.timeout(45000),
                });
                const txt = (await r.text()).trim();
                if (r.ok && txt) return { engine: 'OpenAI Whisper', text: txt };
              } catch {}
            }
            return null;
          }
          // Spoken replies for the panel: ~/bin/falar (Gemini TTS, Piper fallback) or native Gemini/OpenAI/espeak-ng -> Opus, then AAC/M4A so Safari plays it.
          async function synthesizeSpeech(text, outOgg) {
            if (fs.existsSync(HOME_BIN('falar'))) {
              const r = await execCmd(HOME_BIN('falar'), [text, outOgg], 240000);
              if (!fs.existsSync(outOgg)) throw new Error('falar falhou: ' + (r.err || r.out).slice(-300));
              const engine = (/^\[([^\]]+)\]/m.exec(r.out || '') || [])[1] || 'falar';
              return { file: outOgg, engine };
            }
            const geminiKey = env.GEMINI_API_KEY || (secrets.gemini_api_key && secrets.gemini_api_key.value) || '';
            if (geminiKey && binExists('ffmpeg')) {
              try {
                const model = String(env.TTS_MODEL || 'gemini-2.5-flash-preview-tts').trim();
                const voiceName = String(env.TTS_VOICE || 'Kore').trim();
                const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'x-goog-api-key': geminiKey },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text }] }],
                    generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } } },
                  }),
                  signal: AbortSignal.timeout(120000),
                });
                if (r.ok) {
                  const j = await r.json();
                  const parts = (j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
                  const inline = parts.find((p) => p && p.inlineData && p.inlineData.data);
                  if (inline) {
                    const pcm = outOgg + '.pcm';
                    try {
                      fs.writeFileSync(pcm, Buffer.from(inline.inlineData.data, 'base64'));
                      const c = await execCmd('ffmpeg', ['-y', '-loglevel', 'error', '-f', 's16le', '-ar', '24000', '-ac', '1', '-i', pcm, '-af', 'loudnorm=I=-16:TP=-1.5:LRA=11', '-c:a', 'libopus', '-b:a', '40k', outOgg], 120000);
                      if (c.code === 0 && fs.existsSync(outOgg)) return { file: outOgg, engine: 'Gemini TTS' };
                    } finally {
                      try { fs.unlinkSync(pcm); } catch {}
                    }
                  }
                }
              } catch {}
            }
            const openaiKey = env.OPENAI_API_KEY || (secrets.openai_api_key && secrets.openai_api_key.value) || '';
            if (openaiKey) {
              try {
                const r = await fetch('https://api.openai.com/v1/audio/speech', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + openaiKey },
                  body: JSON.stringify({ model: env.OPENAI_TTS_MODEL || 'tts-1', voice: env.OPENAI_TTS_VOICE || 'nova', input: text, response_format: 'opus' }),
                  signal: AbortSignal.timeout(120000),
                });
                if (r.ok) {
                  const buf = Buffer.from(await r.arrayBuffer());
                  if (buf.length) {
                    fs.writeFileSync(outOgg, buf);
                    return { file: outOgg, engine: 'OpenAI TTS' };
                  }
                }
              } catch {}
            }
            if (binExists('espeak-ng') && binExists('ffmpeg')) {
              const wav = outOgg + '.wav';
              try {
                const sp = await execCmd('espeak-ng', ['-v', env.ESPEAK_VOICE || 'pt-br', '-w', wav, text], 60000);
                if (sp.code === 0 && fs.existsSync(wav)) {
                  const c = await execCmd('ffmpeg', ['-y', '-loglevel', 'error', '-i', wav, '-af', 'highpass=f=80,loudnorm=I=-16:TP=-1.5:LRA=11', '-ac', '1', '-ar', '24000', '-c:a', 'libopus', '-b:a', '40k', outOgg], 120000);
                  if (c.code === 0 && fs.existsSync(outOgg)) return { file: outOgg, engine: 'Local espeak-ng' };
                }
              } finally {
                try { fs.unlinkSync(wav); } catch {}
              }
            }
            throw new Error('TTS não configurado: defina GEMINI_API_KEY ou OPENAI_API_KEY, ou instale espeak-ng + ffmpeg');
          }
          function speakableText(md) {
            return String(md || '').replace(/```[\s\S]*?```/g, ' ').replace(/`([^`]+)`/g, (_, a) => a).replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
              .replace(/\[([^\]]+)\]\([^)]*\)/g, (_, a) => a).replace(/https?:\/\/\S+/g, ' ').replace(/^\s*[-*+]\s+/gm, '').replace(/^\s*#+\s*/gm, '')
              .replace(/^\s*>\s?/gm, '').replace(/^\s*\|?[\s:|-]+\|?\s*(?=\n|(?![\s\S]))/gm, '')
              .replace(/^\s*\|(.*)\|\s*(?=\n|(?![\s\S]))/gm, (_, row) => row.split('|').map((x) => x.trim()).filter(Boolean).join(', ') + '. ').replace(/\|/g, ', ').replace(/[*_~#]/g, '').replace(/\s+/g, ' ').trim();
          }
          const ttsJobs = new Map();
          function webTts(chatId, msgId) {
            const key = chatId + ':' + msgId;
            if (ttsJobs.has(key)) return ttsJobs.get(key);
            const job = (async () => {
              const m = webHistory(chatId).find((x) => x.id === msgId);
              if (!m || m.role !== 'assistant') throw new Error('mensagem não encontrada');
              if (m.tts && fs.existsSync(path.join(INBOX, m.tts))) return { file: m.tts, engine: m.ttsEngine };
              let text = speakableText(m.text);
              if (!text) throw new Error('nada para falar');
              if (text.length > 3000) text = text.slice(0, 3000).replace(/[^.!?]*(?![\s\S])/, '') || text.slice(0, 3000);
              const name = 'web-tts-' + String(chatId).slice(4).replace(/[^a-f0-9]/g, '') + '-' + msgId.replace(/[^a-f0-9]/g, '');
              const ogg = path.join(INBOX, name + '.ogg'), m4a = path.join(INBOX, name + '.m4a');
              const tts = await synthesizeSpeech(text, ogg);
              const engine = tts.engine || '';
              const c = await execCmd('ffmpeg', ['-y', '-loglevel', 'error', '-i', ogg, '-c:a', 'aac', '-b:a', '64k', '-movflags', '+faststart', m4a], 120000);
              try { fs.unlinkSync(ogg); } catch {}
              if (c.code !== 0 || !fs.existsSync(m4a)) throw new Error('conversão falhou: ' + c.err.slice(-300));
              webUpdate(chatId, msgId, { tts: name + '.m4a', ttsEngine: engine });
              return { file: name + '.m4a', engine };
            })();
            ttsJobs.set(key, job);
            job.finally(() => setTimeout(() => ttsJobs.delete(key), 1000)).catch(() => {});
            return job;
          }
          const clip = (s, n) => { s = typeof s === 'string' ? s : JSON.stringify(s); return s && s.length > n ? s.slice(0, n) + '…' : (s || ''); };

          // Turns Claude Code stream-json events into small events for the panel: text, tool calls, tool results.
          function webEventsFrom(ev, tools) {
            const out = [];
            if (ev.type === 'system' && ev.subtype === 'init') {
              out.push({ type: 'init', model: ev.model, mcp: (ev.mcp_servers || []).map((s) => ({ name: s.name, status: s.status })) });
            }
            if (ev.type === 'assistant' && ev.message && Array.isArray(ev.message.content)) {
              for (const b of ev.message.content) {
                if (b.type === 'text' && b.text) out.push({ type: 'text', text: b.text });
                if (b.type === 'tool_use') {
                  const t = { id: b.id, name: b.name, input: clip(b.input, 600) };
                  tools.push(t);
                  out.push({ type: 'tool', ...t });
                }
              }
            }
            if (ev.type === 'user' && ev.message && Array.isArray(ev.message.content)) {
              for (const b of ev.message.content) {
                if (b.type !== 'tool_result') continue;
                const text = Array.isArray(b.content) ? b.content.map((x) => x.text || '').join('\n') : b.content;
                const t = tools.find((x) => x.id === b.tool_use_id);
                if (t) { t.result = clip(text, 800); t.isError = Boolean(b.is_error); }
                out.push({ type: 'tool_result', id: b.tool_use_id, text: clip(text, 800), isError: Boolean(b.is_error) });
              }
            }
            return out;
          }

          // Files sent from the web chat: saved in INBOX like WhatsApp media, and the path goes to the agent.
          const WEB_MAX_FILE = 25 * 1024 * 1024;
          function saveWebFiles(files) {
            const out = [];
            for (const f of Array.isArray(files) ? files.slice(0, 10) : []) {
              const buf = Buffer.from(String(f.data || ''), 'base64');
              if (!buf.length) continue;
              if (buf.length > WEB_MAX_FILE) throw new Error('arquivo grande demais (máx. 25 MB): ' + f.name);
              const type = String(f.type || 'application/octet-stream').slice(0, 100);
              const ext = path.extname(String(f.name || '')) || '.' + (type.split('/')[1] || 'bin').split(';')[0];
              const base = path.basename(String(f.name || 'arquivo'), path.extname(String(f.name || ''))).replace(/[^\w.-]+/g, '_').slice(0, 60) || 'arquivo';
              const name = 'web-' + new Date().toISOString().replace(/[:.]/g, '-') + '-' + crypto.randomBytes(2).toString('hex') + '_' + base + ext.replace(/[^\w.]/g, '');
              fs.writeFileSync(path.join(INBOX, name), buf);
              out.push({ name: String(f.name || name).slice(0, 120), type, size: buf.length, file: name, voice: Boolean(f.voice) });
            }
            return out;
          }
          function promptWithFiles(text, files, transcript, engine) {
            if (!files.length) return text;
            const notes = files.map((f) => {
              const kind = f.voice ? 'uma mensagem de voz' : f.type.startsWith('image/') ? 'uma imagem' : f.type.startsWith('audio/') ? 'um áudio' : f.type.startsWith('video/') ? 'um vídeo' : 'um arquivo';
              return '[O usuário enviou ' + kind + ' (' + f.type + ', ' + f.name + ') salvo em ' + path.join(INBOX, f.file) + ']';
            });
            if (transcript) notes.push(engine
              ? '[Transcrição automática da mensagem de voz, já feita pela ponte (motor: ' + engine + '). Não transcreva de novo; ao citar o motor, use este: ' + transcript + ']'
              : '[Transcrição automática da mensagem de voz, feita no navegador: ' + transcript + ']');
            return notes.join('\n') + '\n\n' + (text || (transcript ? 'Responda à mensagem de voz.' : 'Analise o conteúdo e responda.'));
          }

          // ---------- AI chat titles ----------
          // After the first exchange of a web chat still carrying the default title (first message cut to 60 chars), the
          // chat's provider writes a short descriptive title with its cheapest model. Runs in the background; any failure
          // keeps the current title. Titles edited by hand (titleManual) are never overwritten.
          const TITLE_MODELS = { claude: 'haiku', copilot: 'claude-haiku-4.5' };
          const titleBusy = new Set();
          async function autoTitleChat(chatId, userText, replyText) {
            try {
              const c = chats[chatId];
              if (!c || c.titleManual || c.titleGenerated || !c.titleAuto || titleBusy.has(chatId) || settings.autoTitle === false || env.BRIDGE_AUTO_TITLE === 'off') return;
              if (!String(userText || '').trim()) return;
              titleBusy.add(chatId);
              const provider = runConfig(c).provider;
              const cid = 'title:' + crypto.randomBytes(4).toString('hex');
              const prompt = 'Gere um título curto (3 a 7 palavras, no máximo 50 caracteres) em português do Brasil que descreva esta conversa, para o usuário encontrá-la depois. Responda SOMENTE com o título: sem aspas, sem ponto final, sem explicação, sem usar ferramentas.\n\nMensagem do usuário:\n'
                + String(userText).slice(0, 600) + '\n\nResposta do assistente:\n' + String(replyText || '').slice(0, 600);
              let r;
              try {
                r = await Promise.race([
                  runAgent(cid, prompt, { readOnly: true, noSteer: true, noFallback: true, noRouting: true, skipSemantic: true, providerOverride: provider, modelOverride: TITLE_MODELS[provider] || '' }),
                  new Promise((resolve) => setTimeout(() => resolve({ error: 'timeout' }), 60000)),
                ]);
              } finally { delete chats[cid]; }
              if (!r || r.error || r.stopped) return;
              let t = String(r.text || '').split('\n').map((x) => x.trim()).find(Boolean) || '';
              const junk = /["'“”«»*#.\s]/;
              t = t.replace(/^(t[ií]tulo\s*:\s*)/i, '').replace(/\s+/g, ' ');
              while (t && junk.test(t[0])) t = t.slice(1);
              while (t && junk.test(t[t.length - 1])) t = t.slice(0, -1);
              t = t.slice(0, 60);
              const cur = chats[chatId];
              if (!t || t.length < 3 || !cur || cur.titleManual || !cur.titleAuto) return;
              cur.title = t; cur.titleGenerated = true; delete cur.titleAuto;
              save();
              audit({ action: 'chat-title', chatId, provider });
              webEmit(chatId, { type: 'title', title: t });
            } catch (e) { log('auto title failed', e.message); }
            finally { titleBusy.delete(chatId); }
          }

          function webSend(chatId, text, files = [], transcript = '') {
            const c = chat(chatId);
            const um = webAppend(chatId, { role: 'user', text, ...(files.length ? { files } : {}), ...(transcript ? { transcript } : {}) });
            let label = text || transcript || (files[0] && (files[0].voice ? 'Mensagem de voz' : files[0].name)) || '';
            if (!c.title || c.title === 'Nova conversa') { c.title = label.replace(/\s+/g, ' ').slice(0, 60); c.titleAuto = true; save(); }
            // Support bridge slash commands directly in the web panel (/new, /status, /provider, /model, /effort, /bot, /stop, /council, /usage, /log, /schedules, /help)
            if (!files.length && text.startsWith('/')) {
              const firstCmd = text.trim().split(/\s+/)[0].toLowerCase();
              if (['/help', '/new', '/provider', '/model', '/effort', '/bot', '/stop', '/status', '/usage', '/log', '/schedules', '/council'].includes(firstCmd)) {
                handleWebCommand(chatId, text).catch((e) => log('web cmd error', e.message));
                return { injected: false, command: firstCmd };
              }
            }
            // Starts right away (not in the queue) so the text shows under the voice note while an earlier run finishes.
            const voice = files.find((f) => f.voice || f.type.startsWith('audio/'));
            const transcribing = voice && !transcript ? transcribeFile(path.join(INBOX, voice.file)).catch(() => null) : null;
            if (transcribing) transcribing.then((tr) => {
              if (!tr) return webUpdate(chatId, um.id, { transcriptFailed: true });
              webUpdate(chatId, um.id, { transcript: tr.text, transcriptEngine: tr.engine });
              if (c.title === 'Mensagem de voz') { c.title = tr.text.replace(/\s+/g, ' ').slice(0, 60); c.titleAuto = true; save(); }
            });
            let usedSkillSlug = '';
            const buildPrompt = (tr) => {
              const exp = expandSkillPrompt(text);
              if (exp.skill) usedSkillSlug = exp.skill.slug;
              let pText = promptWithFiles(exp.text, files, tr ? tr.text : transcript, tr ? tr.engine : '');
              if (c.forkPendingContext) {
                const prior = webHistory(chatId).slice(0, -1).slice(-12);
                if (prior.length) {
                  const ctx = prior.map((m) => (m.role === 'user' ? 'Usuário' : 'Assistente') + ': ' + String(m.text || '').slice(0, 600)).join('\n\n');
                  pText = '[Contexto de conversa ramificada (fork) — continue a partir deste histórico:]\n' + ctx + '\n\n[Nova mensagem neste ramo:]\n' + pText;
                }
                delete c.forkPendingContext;
                save();
              }
              return pText;
            };
            // While a run is going on, Claude Code reads the new message mid-run (voice notes after the transcription).
            const inject = (prompt) => {
              if (!tryInject(chatId, prompt)) return false;
              webUpdate(chatId, um.id, { injected: true });
              log('web: message injected into the running task', chatId);
              return true;
            };
            const queueRun = () => enqueue(chatId, async () => {
              const tr = transcribing ? await transcribing : null;
              if (tr && !text) label = tr.text;
              const prompt = buildPrompt(tr);
              const targets = mentionsIn(text || (tr && tr.text) || transcript, c);
              for (const id of targets.length ? targets : [null]) {
                const who = bots[id || botOf(c).id] || botOf(c);
                const provider = runConfig(c, id || undefined).provider;
                webEmit(chatId, { type: 'start', provider, bot: who.id });
                const tools = [];
                const onEvent = (ev) => { for (const e of webEventsFrom(ev, tools)) webEmit(chatId, e); };
                const started = Date.now();
                delegLog.delete(chatId);
                promptLog.delete(chatId);
                const r = await runTurn(chatId, id, targets.length ? groupPrompt(chatId, id, prompt) : prompt, null, onEvent,
                  () => webEmit(chatId, { type: 'text', text: '(a sessão anterior não abriu; começando uma nova)' }), { displayPrompt: label || prompt });
                const ms = r.usage ? r.usage.ms : Date.now() - started;
                recordRun(chatId, { prompt: label.slice(0, 80), ms, cost: r.usage ? r.usage.cost : 0, error: r.stopped ? 'interrompido pelo usuário' : r.error });
                const delegations = delegLog.get(chatId) || [];
                delegLog.delete(chatId);
                const cards = promptLog.get(chatId) || [];
                promptLog.delete(chatId);
                const parsedReply = (!r.stopped && !r.error) ? extractSuggestions(r.text || '') : { text: r.stopped ? '(interrompido)' : 'Erro: ' + r.error, suggestions: [] };
                const effectiveProv = r.provider || provider;
                const meta = {
                  ...(r.fallbackFrom ? { fallbackFrom: r.fallbackFrom } : {}),
                  ...(r.routedReason ? { routedReason: r.routedReason } : {}),
                  ...(usedSkillSlug ? { skills: [usedSkillSlug] } : {}),
                  ...(Array.isArray(r.semanticHits) && r.semanticHits.length ? { memories: r.semanticHits } : {}),
                };
                webAppend(chatId, {
                  role: 'assistant', provider: effectiveProv, bot: who.id, tools, ...(delegations.length ? { delegations } : {}), ...(cards.length ? { prompts: cards } : {}),
                  ...(parsedReply.suggestions.length ? { suggestions: parsedReply.suggestions } : {}),
                  ...(Object.keys(meta).length ? { meta } : {}),
                  text: parsedReply.text,
                  error: Boolean(r.error), stopped: Boolean(r.stopped),
                  usage: { ms, cost: r.usage ? r.usage.cost : 0, turns: r.usage ? r.usage.turns : 0, ...(r.usage && r.usage.estimated ? { estimated: true } : {}) },
                });
                if (!r.stopped && !r.error) autoTitleChat(chatId, label || (tr && tr.text) || '', parsedReply.text);
                if (r.stopped) break;
              }
              webEmit(chatId, { type: 'idle' });
            });
            if (running.has(chatId) && (pending.get(chatId) || 0) <= 1 && running.get(chatId).inject) {
              if (!transcribing) { if (inject(buildPrompt(null))) return { injected: true }; }
              else {
                transcribing.then((tr) => { if (!inject(buildPrompt(tr))) queueRun(); });
                return { injected: 'pending' };
              }
            }
            queueRun();
            return { injected: false };
          }

          // ---------- usage: plan limits (Claude, Antigravity) and daily history for the panel ----------
          // Every run appends one line to usage.jsonl. Claude's history before that file existed is rebuilt from
          // Claude Code's own transcripts (~/.claude/projects/**/*.jsonl), which carry token counts per message.
          const USAGE_FILE = path.join(DATA_DIR, 'usage.jsonl');
          function logUsage(provider, chatId, cost, ms, u, model, extra) {
            try {
              u = u || {};
              const aiuVal = extra && Number(extra.aiu) > 0 ? Math.round(Number(extra.aiu) * 10000) / 10000 : 0;
              const premVal = extra && Number(extra.premiumRequests) > 0 ? Number(extra.premiumRequests) : 0;
              const line = { at: new Date().toISOString(), provider, web: isWeb(chatId), cost: cost || 0, ms: ms || 0,
                ...(model ? { model: String(model) } : {}),
                ...(aiuVal > 0 ? { aiu: aiuVal } : {}),
                ...(premVal > 0 ? { premiumRequests: premVal } : {}),
                in: (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0), out: (u.output_tokens || 0) + (u.thinking_tokens || 0),
                cacheRead: u.cache_read_input_tokens || u.cache_read_tokens || 0 };
              fs.appendFileSync(USAGE_FILE, JSON.stringify(line) + '\n');
            } catch (e) { log('usage log failed', e.message); }
          }
          const dayKey = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(d));
          const HOME_DIR = env.HOME || '/tmp';
          const readJson = (f) => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch { return null; } };

          const usageCache = { claude: null, agy: null, agyProject: null, claudeBlockedUntil: 0, copilot: null };
          const CLAUDE_USAGE_TTL = 5 * 60000; // the oauth/usage endpoint rate-limits hard: poll at most every 5 min
          const COPILOT_USAGE_TTL = 2 * 60000;
          const CLAUDE_CRED_FILE = path.join(HOME_DIR, '.claude', '.credentials.json');
          const CLAUDE_OAUTH_CLIENT_ID = '9d1c250a-e61b-44d9-88ed-5944d1962f5e';
          // Refreshes ~/.claude/.credentials.json with its refreshToken. Runs use CLAUDE_CODE_OAUTH_TOKEN, so nothing
          // else refreshes this file and its access token expires after a few hours.
          async function refreshClaudeToken(cred) {
            if (!cred?.refreshToken) throw new Error('token vencido e sem refreshToken: rode /login no Claude Code');
            let r, lastErr;
            for (const url of ['https://platform.claude.com/v1/oauth/token', 'https://console.anthropic.com/v1/oauth/token']) {
              try {
                r = await fetch(url, { method: 'POST', signal: AbortSignal.timeout(15000), headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ grant_type: 'refresh_token', refresh_token: cred.refreshToken, client_id: CLAUDE_OAUTH_CLIENT_ID }) });
                if (r.ok) break;
                lastErr = new Error('renovação do token: HTTP ' + r.status);
              } catch (e) { lastErr = e; }
              r = null;
            }
            if (!r) throw lastErr;
            const j = await r.json();
            if (!j.access_token) throw new Error('renovação do token: resposta sem access_token');
            const file = readJson(CLAUDE_CRED_FILE) || {};
            const next = { ...(file.claudeAiOauth || cred), accessToken: j.access_token, refreshToken: j.refresh_token || cred.refreshToken,
              expiresAt: Date.now() + (Number(j.expires_in) || 28800) * 1000 };
            if (j.scope) next.scopes = String(j.scope).split(' ').filter(Boolean);
            const tmp = CLAUDE_CRED_FILE + '.tmp-' + process.pid;
            fs.writeFileSync(tmp, JSON.stringify({ ...file, claudeAiOauth: next }), { mode: 0o600 });
            fs.renameSync(tmp, CLAUDE_CRED_FILE);
            log('claude oauth token refreshed, expires', new Date(next.expiresAt).toISOString());
            return next;
          }
          async function claudeLimits() {
            const c = usageCache.claude;
            if (c && Date.now() - c.t < (c.v?.error ? 60000 : CLAUDE_USAGE_TTL)) return c.v;
            const prevOk = c?.v?.limits ? c.v : null;
            if (Date.now() < usageCache.claudeBlockedUntil) {
              return { ...(prevOk || {}), error: 'HTTP 429 (limite de consultas; nova tentativa após ' + new Date(usageCache.claudeBlockedUntil).toISOString() + ')', stale: Boolean(prevOk), retryAt: new Date(usageCache.claudeBlockedUntil).toISOString() };
            }
            let cred = readJson(CLAUDE_CRED_FILE)?.claudeAiOauth;
            let v;
            try {
              if (!cred?.accessToken) throw new Error('Claude Code sem login OAuth');
              if (cred.expiresAt && cred.expiresAt - Date.now() < 120000) cred = await refreshClaudeToken(cred);
              const get = (tok) => fetch('https://api.anthropic.com/api/oauth/usage', { signal: AbortSignal.timeout(15000),
                headers: { Authorization: 'Bearer ' + tok, 'anthropic-beta': 'oauth-2025-04-20', 'Content-Type': 'application/json' } });
              let r = await get(cred.accessToken);
              if (r.status === 401) { cred = await refreshClaudeToken(cred); r = await get(cred.accessToken); }
              if (r.status === 429) {
                const ra = r.headers.get('retry-after');
                let wait = Number(ra) * 1000;
                if (!(wait > 0)) { const d = Date.parse(ra || ''); wait = d > Date.now() ? d - Date.now() : 0; }
                usageCache.claudeBlockedUntil = Date.now() + Math.min(Math.max(wait || 15 * 60000, 60000), 6 * 3600000);
                throw new Error('HTTP 429 (limite de consultas; nova tentativa após ' + new Date(usageCache.claudeBlockedUntil).toISOString() + ')');
              }
              if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 401 ? ' (token recusado mesmo após renovar: rode /login no Claude Code)' : ''));
              const j = await r.json();
              const lim = (k, x) => x && { kind: k, percent: x.utilization ?? null, resetsAt: x.resets_at || null };
              v = { plan: cred.subscriptionType || null, fetchedAt: new Date().toISOString(),
                limits: [lim('session', j.five_hour), lim('weekly', j.seven_day), lim('weekly_opus', j.seven_day_opus), lim('weekly_sonnet', j.seven_day_sonnet)].filter(Boolean),
                extra: j.extra_usage?.is_enabled ? { used: j.extra_usage.used_credits, limit: j.extra_usage.monthly_limit } : null };
            } catch (e) {
              v = { ...(prevOk || {}), error: e.message, stale: Boolean(prevOk) };
              if (usageCache.claudeBlockedUntil > Date.now()) v.retryAt = new Date(usageCache.claudeBlockedUntil).toISOString();
            }
            usageCache.claude = { t: Date.now(), v };
            return v;
          }

          // `agy -p /usage` é comando local (não gasta turno de modelo) e traz as DUAS janelas por grupo.
          // Cada linha: "Grupo<TAB>Métrica<TAB>NN%<TAB>ISO", com NN = percentual RESTANTE.
          function parseAgyUsage(text) {
            const out = [];
            for (const raw of String(text || '').split('\n')) {
              const m = raw.trim().match(/^(.+?)\t(.+?)\t(\d+(?:\.\d+)?)%\t(\S+)/);
              if (!m) continue;
              const [, grp, metric, pct, resetsAt] = m;
              if (!/limit/i.test(metric)) continue;
              const window = /five\s*hour/i.test(metric) ? '5h' : 'weekly';
              const name = grp.replace(/\s+models?\b/i, '').trim();
              if (!name) continue;
              out.push({ name, window, remaining: Number(pct), resetsAt });
            }
            return out;
          }

          async function agyCliWindows(apiGroups) {
            if (!fs.existsSync(AGY_BIN)) return null;
            const r = await execCmd(AGY_BIN, ['-p', '/usage'], 30000);
            const lines = parseAgyUsage(r.out);
            if (!lines.length) return null;
            const famOf = (s) => ['gemini', 'claude', 'gpt'].filter((f) => String(s).toLowerCase().includes(f));
            return lines.map((l) => {
              const fams = famOf(l.name);
              const models = [...new Set(apiGroups.flatMap((g) => g.models).filter((m) => fams.some((f) => m.toLowerCase().includes(f))))].sort();
              return { label: l.name + ' · ' + (l.window === '5h' ? '5 h' : 'semanal'), window: l.window,
                percent: Math.round((100 - l.remaining) * 10) / 10, resetsAt: l.resetsAt, models };
            });
          }

          async function agyLimits() {
            const c = usageCache.agy;
            if (c && Date.now() - c.t < 60000) return c.v;
            let v;
            try {
              let tier = usageCache.agyProject?.tier || null;
              let apiGroups = [];
              let apiErr = null;
              try {
                const tok = readJson(path.join(HOME_DIR, '.gemini', 'antigravity-cli', 'antigravity-oauth-token'))?.token?.access_token;
                if (!tok) throw new Error('Antigravity sem login');
                const call = async (method, body) => {
                  const r = await fetch('https://daily-cloudcode-pa.googleapis.com/v1internal:' + method, { method: 'POST', signal: AbortSignal.timeout(20000),
                    headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', 'User-Agent': 'antigravity' }, body: JSON.stringify(body) });
                  if (!r.ok) throw new Error(method + ': HTTP ' + r.status + (r.status === 401 ? ' (token vencido: renova na próxima execução do agy)' : ''));
                  return r.json();
                };
                if (!usageCache.agyProject) {
                  const la = await call('loadCodeAssist', { metadata: { ideType: 'ANTIGRAVITY' } });
                  usageCache.agyProject = { id: la.cloudaicompanionProject, tier: la.paidTier?.name || la.currentTier?.name || null };
                }
                tier = usageCache.agyProject.tier;
                const fm = await call('fetchAvailableModels', usageCache.agyProject.id ? { project: usageCache.agyProject.id } : {});
                // Models share quota pools: group them by (remaining, reset time). Só a janela semanal aparece aqui.
                const groups = new Map();
                for (const [id, m] of Object.entries(fm.models || {})) {
                  const q = m.quotaInfo;
                  if (!q || !q.resetTime || /^(tab_|chat_)/.test(id)) continue;
                  const key = (q.remainingFraction ?? 1) + '|' + q.resetTime;
                  if (!groups.has(key)) groups.set(key, { remaining: q.remainingFraction ?? 1, resetsAt: q.resetTime, models: [] });
                  groups.get(key).models.push(m.displayName || id);
                }
                const label = (g) => {
                  const t = g.models.join(' ').toLowerCase();
                  const fam = ['gemini', 'claude', 'gpt'].filter((f) => t.includes(f));
                  return fam.map((f) => (f === 'gpt' ? 'GPT' : f[0].toUpperCase() + f.slice(1))).join(' + ') || 'Modelos';
                };
                apiGroups = [...groups.values()].map((g) => ({ label: label(g) + ' · semanal', window: 'weekly', percent: Math.round((1 - g.remaining) * 1000) / 10, resetsAt: g.resetsAt, models: [...new Set(g.models)].sort() }));
              } catch (e) { apiErr = e; }
              // Preferido: o próprio agy, que informa a janela de 5 h e a semanal de cada grupo.
              let cli = null;
              try { cli = await agyCliWindows(apiGroups); } catch (e) { log('agy /usage falhou', e.message); }
              if (!cli && apiErr) throw apiErr;
              const groups = cli || apiGroups;
              v = { tier, fetchedAt: new Date().toISOString(), groups: groups.sort((a, b) => a.label.localeCompare(b.label)) };
            } catch (e) {
              v = { ...(c?.v?.groups ? c.v : {}), error: e.message, stale: Boolean(c?.v?.groups) };
            }
            usageCache.agy = { t: Date.now(), v };
            return v;
          }

          async function copilotLimits() {
            const c = usageCache.copilot;
            if (c && Date.now() - c.t < (c.v && c.v.error ? 60000 : COPILOT_USAGE_TTL)) return c.v;
            const prevOk = c && c.v && c.v.plan ? c.v : null;
            const installed = await isCliBinInstalled(COPILOT_BIN, 'cp');
            if (!installed && !env.COPILOT_USAGE_URL && !env.COPILOT_GITHUB_TOKEN) {
              const v = { installed: false, plan: null, planLabel: null, quotas: [], fetchedAt: new Date().toISOString(), error: null, stale: false };
              usageCache.copilot = { t: Date.now(), v };
              return v;
            }
            const token = await getCopilotToken();
            if (!token) {
              const v = {
                installed,
                ...(prevOk || {}),
                plan: prevOk ? prevOk.plan : null,
                planLabel: prevOk ? prevOk.planLabel : null,
