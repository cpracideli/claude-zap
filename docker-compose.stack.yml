          // Tell each allowed number that the service is up. Retries, because WAHA may not be ready right after boot.
          async function notifyStartup() {
            if (!activeWaha().url || !ALLOWED.length) { log('startup notice skipped (WAHA_URL/ALLOWED_NUMBERS unset)'); return; }
            if (settings.startupNotify === false) { log('startup notice skipped (startupNotify=false)'); return; }
            if (inQuietHours()) { log('startup notice suppressed (quiet hours active)'); return; }
            // Natural, varied wording. Only sent to ALLOWED_NUMBERS, never to anyone else.
            const phrases = [
              'Oi! Aqui é o Claude. O serviço acabou de subir e já está pronto para uso.',
              'Olá, tudo certo por aqui. O serviço já está no ar e disponível para você mandar mensagens.',
              'Oi, só avisando que o serviço voltou e já está pronto para uso.',
            ];
            const text = phrases[Math.floor(Math.random() * phrases.length)];
            for (const number of ALLOWED) {
              for (let attempt = 1; attempt <= 5; attempt++) {
                try { await sendMessage({ to: number, text, raw: true }); log('startup notice sent'); break; }
                catch (e) {
                  log('startup notice to', number, 'attempt', attempt, 'failed:', e.message);
                  await new Promise((r) => setTimeout(r, 15000));
                }
              }
            }
          }

          // WebSocket proxy for live computer noVNC (/admin/computer/ws), Local Computer Bridge (/admin/local-bridge/ws), Gemini Live Voice (/admin/voice/ws) and WaCalls (/admin/wacalls/ws)
          server.on('upgrade', (req, socket, head) => {
            const u = new URL(req.url || '/', 'http://local');
            if (u.pathname === '/admin/local-bridge/ws') {
              return attachLocalBridgeWs(req, socket, head);
            }
            if (u.pathname === '/admin/voice/ws') {
              return attachVoiceLiveWs(req, socket, head);
            }
            if (u.pathname === '/admin/wacalls/ws') {
              return attachWaCallsWs(req, socket, head, u);
            }
            if (u.pathname !== '/admin/computer/ws' || !adminAuthorized(req)) {
              socket.write('HTTP/1.1 401 Unauthorized\r\n\r\n');
              return socket.destroy();
            }
            computer.lastActivity = Date.now();
            const upstream = net.connect(COMPUTER_WS_PORT, '127.0.0.1', () => {
              const hdrs = ['GET / HTTP/1.1', 'Host: 127.0.0.1:' + COMPUTER_WS_PORT];
              for (let i = 0; i < req.rawHeaders.length; i += 2) {
                const k = req.rawHeaders[i], v = req.rawHeaders[i + 1];
                if (/^(host|authorization)(?![\s\S])/i.test(k)) continue;
                hdrs.push(k + ': ' + v);
              }
              upstream.write(hdrs.join('\r\n') + '\r\n\r\n');
              if (head && head.length) upstream.write(head);
              upstream.pipe(socket);
              socket.pipe(upstream);
            });
            const close = () => { try { socket.destroy(); } catch {} try { upstream.destroy(); } catch {} };
            upstream.on('error', close);
            socket.on('error', close);
          });

          server.listen(PORT, () => {
            log('bridge listening on', PORT, '| version', VERSION, '| session', WAHA_SESSION, '| allowed numbers', ALLOWED.length, '| mode', PERMISSION_MODE);
            if (!ALLOWED.length) log('WARNING: ALLOWED_NUMBERS is empty, every message will be ignored');
            if (env.STARTUP_NOTICE !== 'false') setTimeout(notifyStartup, 10000);
            ensureAiMemory().then(() => log('ai-memory:', aiMemory.status)).catch((e) => log('ai-memory check failed', e.message));
            setInterval(() => ensureAiMemory().catch(() => {}), 60000).unref();
            if (WACALLS_ENABLED) {
              ensureWaCalls().catch((e) => log('wacalls check failed', e.message));
            }
            recoverPendingJobs();
            setInterval(runMaintenanceJob, 6 * 3600000).unref();
            setInterval(checkpointWal, 30 * 60000).unref();
            for (const sig of ['SIGTERM', 'SIGINT']) {
              process.on(sig, () => {
                stopWaCallsSse();
                try { if (wacalls.child) wacalls.child.kill('SIGTERM'); } catch {}
                checkpointWal();
                try { if (stateDb) stateDb.close(); } catch {}
                process.exit(0);
              });
            }
            syncTelegramPolling();
            syncDiscordGateway();
            // Read the Antigravity model list once at boot, so the log shows what agy offers right now.
            if (fs.existsSync(AGY_BIN)) refreshAgyCatalog(true).then((cat) => {
              log('agy models:', cat.models.map((g) => g.base + (g.efforts.length ? '[' + g.efforts.join('/') + ']' : '')).join(', ') || 'none');
              log('agy models raw:', JSON.stringify(stripAnsi(cat.raw).slice(0, 1500)));
            }).catch((e) => log('agy models failed', e.message));
          });

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped
  agent-control:
    image: node:22-alpine
    depends_on:
      - claude-bridge
    expose:
      - "3001"
    working_dir: /app
    command:
      - sh
      - -c
      - |
        apk add --no-cache git
        REPO="${PANEL_REPO:-https://github.com/cpracideli/agent-control-panel.git}"
        BRANCH="${PANEL_BRANCH:-main}"
        if [ ! -d /app/.git ]; then
          rm -rf /app/.tmp-clone && git clone --depth 1 --branch "$BRANCH" "$REPO" /app/.tmp-clone && cp -a /app/.tmp-clone/. /app/ && rm -rf /app/.tmp-clone
        else
          git -C /app remote set-url origin "$REPO"
          git -C /app fetch --depth 1 origin "$BRANCH" && git -C /app reset --hard FETCH_HEAD
        fi
        SHA="$(git -C /app rev-parse HEAD)"
        if [ ! -f /app/dist/index.html ] || [ "$(cat /app/.built-sha 2>/dev/null)" != "$SHA" ]; then
          cd /app && npm ci && npm run build && echo "$SHA" > /app/.built-sha
        fi
        exec node /app/server.js
    environment:
      - PORT=3001
      - BRIDGE_URL=${BRIDGE_URL:-http://claude-bridge:3000}
      - BRIDGE_ADMIN_TOKEN=${BRIDGE_ADMIN_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - PUBLIC_URL=${PUBLIC_URL}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - ALLOWED_AUTH_EMAILS=${ALLOWED_AUTH_EMAILS}
      - COOLIFY_URL=${COOLIFY_URL}
      - COOLIFY_TOKEN=${COOLIFY_TOKEN}
      - COOLIFY_APP_UUID=${COOLIFY_APP_UUID}
      - PANEL_REPO=${PANEL_REPO:-https://github.com/cpracideli/agent-control-panel.git}
      - PANEL_BRANCH=${PANEL_BRANCH:-main}
    volumes:
      - panel-app:/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped
volumes:
  claude-home:
  panel-app:
