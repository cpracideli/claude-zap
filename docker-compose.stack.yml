                const cw = Number(tk.cache && tk.cache.write) || 0;
                const cr = Number(tk.cache && tk.cache.read) || 0;
                const outTok = (Number(tk.output) || 0) + (Number(tk.reasoning) || 0);
                const cost = Number(msg.cost) || 0;
                const nonCacheIn = inp + cw;
