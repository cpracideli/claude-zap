              notifyChatId: b.notifyChatId && chats[b.notifyChatId] ? String(b.notifyChatId) : '',
              maxRuns: Math.min(Math.max(Number(b.maxRuns) || 0, 0), 200),
              runCount: 0,
              autoFailCount: 0,
